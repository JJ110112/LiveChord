<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveChord — Core</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#e94560">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/css/base.css?v=1">
  <link rel="stylesheet" href="/css/home.css?v=1">
  <script>
    if (!localStorage.getItem("livechord_token")) {
      window.location.href = "/login";
    }
  </script>
  <style>
    .admin-page { max-width: 960px; margin: 0 auto; padding: 20px 24px; }
    .card { background: var(--bg-card); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; }
    .card h2 { font-size: 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .card h2 .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot-green { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
    .dot-yellow { background: #ff9800; box-shadow: 0 0 6px #ff9800; }
    .dot-red { background: #f44; }
    .dot-gray { background: #555; }
    .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; margin-bottom: 12px; }
    .stat-box { background: var(--bg); border-radius: 8px; padding: 10px; text-align: center; }
    .stat-box .num { font-size: 22px; font-weight: 800; color: var(--accent); }
    .stat-box .label { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
    .progress-track { height: 4px; background: #222; border-radius: 2px; overflow: hidden; margin: 6px 0; }
    .progress-track .bar { height: 100%; background: var(--accent); border-radius: 2px; transition: width .5s; }
    .progress-track .bar.green { background: #4caf50; }
    .progress-track .bar.indeterminate {
      background: linear-gradient(90deg, transparent 0%, #4caf50 50%, transparent 100%);
      background-size: 40% 100%;
      background-repeat: no-repeat;
      animation: indet-slide 1.5s linear infinite;
    }
    @keyframes indet-slide {
      0%   { background-position: -40% 0; }
      100% { background-position: 140% 0; }
    }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .actions button { padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--text); cursor: pointer; font-size: 12px; transition: all .15s; }
    .actions button:hover { background: var(--bg-hover); }
    .actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .actions button.primary:hover { background: var(--accent-dim); }
    .actions button:disabled { opacity: .4; cursor: not-allowed; }
    .setting-row { display: flex; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px solid #1a1a1a; }
    .setting-row:last-child { border-bottom: none; }
    .setting-row > div:first-child { flex: 1; }
    .setting-row label { font-size: 12px; }
    .setting-row .desc { font-size: 10px; color: var(--text-dim); }
    .toggle { position: relative; width: 42px; min-width: 42px; height: 22px; cursor: pointer; flex: 0 0 auto; }
    .toggle input { display: none; }
    .toggle .slider { position: absolute; inset: 0; background: #444; border-radius: 11px; transition: .3s; }
    .toggle .slider::before { content: ""; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .3s; }
    .toggle input:checked + .slider { background: var(--accent); }
    .toggle input:checked + .slider::before { transform: translateX(20px); }
    .num-input { width: 60px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text); font-size: 12px; text-align: center; }
    .log-box { background: #0a0a0a; border-radius: 6px; padding: 10px 14px; max-height: 200px; overflow-y: auto; font-size: 11px; font-family: "Consolas", monospace; line-height: 1.6; }
    .log-box .ts { color: #555; }
    .log-box .ok { color: #4caf50; }
    .log-box .info { color: #888; }
    .log-box .error { color: #f66; }
    .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
    .badge-running { background: rgba(76,175,80,.15); color: #4caf50; }
    .badge-waiting { background: rgba(255,152,0,.15); color: #ff9800; }
    .badge-stopped { background: rgba(255,255,255,.08); color: #888; }
    .badge-detecting { background: rgba(233,69,96,.15); color: var(--accent); }
    .badge-scanning { background: rgba(33,150,243,.15); color: #2196f3; }
    .current-task { font-size: 12px; color: var(--text-dim); margin-top: 4px; min-height: 16px; }
    .trk { display: flex; align-items: center; gap: 10px; padding: 5px 8px; border-bottom: 1px solid #1a1a1a; }
    .trk:hover { background: var(--bg-hover); }
    .trk .trk-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
    .trk .trk-artist { width: 100px; color: var(--text-dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .trk .trk-badge { font-size: 10px; padding: 1px 6px; border-radius: 8px; white-space: nowrap; }
    .trk .b-midi { background: rgba(76,175,80,.15); color: #4caf50; }
    .trk .b-chordify { background: rgba(33,150,243,.15); color: #2196f3; }
    .trk .b-btc { background: rgba(255,152,0,.15); color: #ff9800; }
    .trk .b-none { background: rgba(255,255,255,.05); color: #666; }
    .trk button { padding: 2px 8px; border: 1px solid var(--border); border-radius: 4px; background: transparent; color: var(--text-dim); cursor: pointer; font-size: 10px; white-space: nowrap; }
    .trk button:hover { background: var(--bg-hover); color: var(--text); }
    .collapse-content { display: none; }
    .collapse-content.show { display: block; }
    .collapse-toggle { cursor: pointer; user-select: none; }
    .collapse-toggle::after { content: " ▸"; font-size: 12px; }
    .collapse-toggle.open::after { content: " ▾"; }
    /* 群組表 */
    .group-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .group-table th { text-align: left; padding: 6px 8px; color: var(--text-dim); font-weight: 600; border-bottom: 1px solid #1a1a1a; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
    .group-table td { padding: 8px; border-bottom: 1px solid #161616; vertical-align: middle; }
    .group-table tr:hover td { background: var(--bg-hover); }
    .group-table .col-active { width: 32px; text-align: center; }
    .group-table .col-active input[type="checkbox"] { cursor: pointer; }
    .group-table .col-root { color: var(--text-dim); font-family: "Consolas", monospace; font-size: 11px; width: 70px; }
    .group-table .col-label { font-weight: 600; min-width: 110px; }
    .group-table .col-count { text-align: right; width: 70px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
    .group-table .col-cov { width: 28%; }
    .group-table .col-action { width: 80px; text-align: right; }
    .cov-bar { position: relative; height: 14px; background: #181818; border-radius: 4px; overflow: hidden; }
    .cov-bar .fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #4caf50, #8bc34a); transition: width .4s; }
    .cov-bar .pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; text-shadow: 0 0 2px rgba(0,0,0,.7); font-weight: 600; }
    .group-table .btn-detect { padding: 4px 10px; border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 4px; cursor: pointer; font-size: 11px; }
    .group-table .btn-detect:hover { background: rgba(233,69,96,.12); }
    .group-table .btn-detect:disabled { opacity: .35; cursor: not-allowed; border-color: #555; color: #555; }
    .group-table .row-busy td { background: rgba(33,150,243,.08); }
    .core-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .core-actions button { padding: 8px 18px; font-size: 13px; border-radius: 6px; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text); }
    .core-actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .core-actions button.primary:hover { background: var(--accent-dim); }
    .core-actions button:disabled { opacity: .4; cursor: not-allowed; }
    .lock-tag { font-size: 11px; color: #2196f3; background: rgba(33,150,243,.12); padding: 2px 8px; border-radius: 10px; margin-left: 8px; }
    /* 跳過類別 — 12 大分類 grid */
    .gt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
    .gt-cat { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid #1a1a1a; border-radius: 4px; background: rgba(255,255,255,.02); font-size: 12px; cursor: pointer; user-select: none; }
    .gt-cat:hover { background: rgba(255,255,255,.05); }
    .gt-cat.empty { opacity: .4; cursor: not-allowed; }
    .gt-cat input { cursor: pointer; }
    .gt-cat.empty input { cursor: not-allowed; }
    .gt-cat-label { color: var(--text); font-weight: 600; }
    .gt-cat-stat { margin-left: auto; color: var(--text-dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>

<header class="header">
  <a href="/" style="text-decoration:none"><h1>LiveChord</h1></a>
  <span style="color:var(--text-dim);font-size:14px;margin-left:12px">Core</span>
</header>

<!-- 冷啟動進度條：4 個初始 API 各 25% -->
<div id="initLoader" style="position:fixed;top:0;left:0;right:0;height:2px;background:transparent;z-index:9999;pointer-events:none">
  <div id="initLoaderBar" style="height:100%;width:0%;background:linear-gradient(90deg,var(--accent),#4ade80);transition:width .25s ease,opacity .4s ease 0.3s;opacity:1"></div>
</div>

<div class="admin-page">

  <!-- ======== Card 1: Core 狀態與快速啟動 ======== -->
  <div class="card">
    <h2>
      <span class="dot dot-gray" id="coreDot"></span>
      LiveChord Core
      <span class="badge badge-stopped" id="coreBadge">stopped</span>
      <span id="lockTag" class="lock-tag" style="display:none"></span>
    </h2>
    <div class="stat-row">
      <div class="stat-box"><div class="num" id="sTotalTracks">—</div><div class="label">總曲目</div></div>
      <div class="stat-box"><div class="num" id="sWithChords">—</div><div class="label">和弦譜</div></div>
      <div class="stat-box"><div class="num" id="sCoverage">—</div><div class="label">覆蓋率</div></div>
      <div class="stat-box"><div class="num" id="sQueueSize">—</div><div class="label">待偵測</div></div>
    </div>
    <div class="progress-track"><div class="bar green" id="coreBar" style="width:0%"></div></div>
    <div class="current-task" id="currentTask"></div>
    <div class="core-actions" style="margin-top:12px">
      <button id="btnCoreToggle" style="display:none">⏸ 停止 Core</button>
    </div>
  </div>

  <!-- ======== Card 2: 設定（預設展開）======== -->
  <div class="card">
    <h2 class="collapse-toggle open" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('show')">⚙️ 設定</h2>
    <div class="collapse-content show">
      <!-- 1. 音樂庫路徑 -->
      <div class="setting-row" style="flex-direction:column;align-items:stretch;gap:6px">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <label>音樂庫路徑</label>
          <button id="btnAddRoot" style="padding:2px 8px;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--text-dim);cursor:pointer;font-size:11px">+ 新增</button>
        </div>
        <div id="musicRootsList" style="display:flex;flex-direction:column;gap:4px"></div>
      </div>
      <!-- 2. 啟用群組 -->
      <div class="setting-row" style="flex-direction:column;align-items:stretch;gap:6px">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <label>啟用群組</label>
          <span id="optActiveGroupsSummary" style="font-size:11px;color:var(--text-dim)">—</span>
          <span id="groupsSummary" style="font-size:11px;color:var(--text-dim);margin-left:auto"></span>
        </div>
        <div id="groupsHost">
          <span style="color:var(--text-dim);font-size:12px">載入中…</span>
        </div>
      </div>
      <!-- 3. 跳過類別 -->
      <div class="setting-row" style="flex-direction:column;align-items:stretch;gap:6px">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <label>跳過類別</label>
          <span id="skipGenresSummary" style="font-size:11px;color:var(--text-dim)"></span>
        </div>
        <div id="skipGenresList" class="gt-grid" style="padding:6px;border:1px solid var(--border);border-radius:4px;background:var(--bg)"></div>
      </div>
      <!-- 4. 自動掃描 -->
      <div class="setting-row">
        <div><label>自動掃描</label></div>
        <label class="toggle"><input type="checkbox" id="optAutoScan"><span class="slider"></span></label>
        <input type="number" class="num-input" id="optScanInterval" value="30" min="1" max="1440" style="width:65px">
        <span style="font-size:11px;color:var(--text-dim)">分鐘</span>
      </div>
      <!-- 5. 自動偵測和弦 -->
      <div class="setting-row">
        <div><label>自動偵測和弦</label></div>
        <label class="toggle"><input type="checkbox" id="optAutoChord"><span class="slider"></span></label>
        <input type="number" class="num-input" id="optMaxPerCycle" value="20" min="1" max="200" style="width:65px">
        <span style="font-size:11px;color:var(--text-dim)">首/輪</span>
      </div>
      <!-- 6. 服務啟動時自動開啟 Core -->
      <div class="setting-row">
        <div><label>服務啟動時自動開啟 Core</label></div>
        <label class="toggle"><input type="checkbox" id="optAutoStartOnBoot"><span class="slider"></span></label>
        <span style="font-size:11px;color:var(--text-dim)">只影響下次後端服務重啟時的行為，不影響目前 Core 狀態</span>
      </div>
      <!-- 7. 套用設定並啟動 -->
      <div class="setting-row" style="justify-content:flex-end;margin-top:4px">
        <button class="primary" id="btnApplyAndStart" title="儲存所有設定 → 增量掃描 → 啟動 Core">💾 套用設定並啟動</button>
      </div>
    </div>
  </div>

  <!-- ======== Card 3: 活動記錄（預設展開）======== -->
  <div class="card">
    <h2 class="collapse-toggle open" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('show')">📜 活動記錄</h2>
    <div class="collapse-content show">
      <div class="log-box" id="logBox"><span class="info">等待載入…</span></div>
    </div>
  </div>

  <!-- ======== Card 4: 和弦管理（收摺）======== -->
  <div class="card">
    <h2 class="collapse-toggle" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('show')">🎵 和弦管理</h2>
    <div class="collapse-content">
      <div class="actions" style="margin-bottom:8px; display:flex; gap:8px; align-items:center;">
        <input type="text" id="trackSearch" placeholder="搜尋曲目或歌手..." class="num-input" style="flex:1; max-width:200px; text-align:left;">
        <select id="trackStatus" class="num-input" style="width: auto;">
          <option value="all">全部</option>
          <option value="no_chords">未偵測</option>
          <option value="has_chords">已偵測</option>
        </select>
        <button id="btnRefreshTracks">重新整理</button>
        <button id="btnBatchMidi" title="掃尋 MIDI 目錄並自動匯入未偵測曲目的和弦">自動配對 MIDI</button>
        <span id="midiStatus" style="font-size:11px;color:var(--text-dim);margin-left:auto"></span>
      </div>
      <div id="trackList" style="max-height:50vh;overflow-y:auto; margin-bottom:8px;">
        <span style="color:var(--text-dim);font-size:12px">展開後載入</span>
      </div>
      <div id="paginationBar" style="display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-dim); justify-content:center;">
        <button id="btnPrevPage" style="padding:2px 8px;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--text);cursor:pointer;">上一頁</button>
        <span id="pageInfo">頁 1 / 1</span>
        <button id="btnNextPage" style="padding:2px 8px;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--text);cursor:pointer;">下一頁</button>
      </div>
    </div>
  </div>

  <!-- ======== Card 5: 分散式萃取（收摺）======== -->
  <div class="card" style="padding-bottom:0; overflow:hidden;">
    <h2 class="collapse-toggle" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('show')">🛰️ 分散式萃取叢集</h2>
    <div class="collapse-content" style="margin: -10px -20px 0 -20px;">
      <iframe src="/extraction?embed=1" style="width:100%; height:80vh; border:none; display:block;"></iframe>
    </div>
  </div>

</div>

<div id="toast" class="toast"></div>

<script src="/js/utils.js?v=1"></script>
<script src="/js/genre_taxonomy.js?v=1"></script>
<script>
  const originalFetch = window.fetch;
  window.fetch = function() {
    let [resource, config] = arguments;
    if(config == null) config = {};
    const url = typeof resource === 'string' ? resource : (resource instanceof Request ? resource.url : '');
    if (url.startsWith('/') || url.includes(window.location.host)) {
        if(config.headers == null) config.headers = {};
        const token = localStorage.getItem("livechord_token");
        if(token) config.headers['Authorization'] = `Bearer ${token}`;
    }
    return originalFetch(resource, config);
  };
</script>
<script src="/js/api.js?v=2"></script>
<script>
(function() {
  const $ = s => document.querySelector(s);
  // showToast from utils.js

  // ---- 冷啟動進度條 ----
  // 4 個初始 API：settings, genres, groups, status；每完成 1 個 +25%
  let _initLoaded = 0;
  const INIT_TOTAL = 4;
  function bumpInitProgress() {
    _initLoaded += 1;
    const bar = $("#initLoaderBar");
    if (!bar) return;
    const pct = Math.min(100, Math.round(_initLoaded / INIT_TOTAL * 100));
    bar.style.width = pct + "%";
    if (_initLoaded >= INIT_TOTAL) {
      setTimeout(() => { bar.style.opacity = "0"; }, 200);
      setTimeout(() => { const el = $("#initLoader"); if (el) el.style.display = "none"; }, 800);
    }
  }

  // ---- 跳過類別狀態 ----
  let allGenres = [];           // [{name, count}, ...]
  let skipGenresSet = new Set(); // 目前勾選跳過的 genre 名稱（以 big-category 展開後儲存）

  // Bucket allGenres by big-category (built once per loadGenres).
  let _catBuckets = {};
  function _rebuildBuckets() {
    const tax = window.LC_GENRE_TAXONOMY;
    _catBuckets = {};
    if (!tax) return;
    for (const k of tax.CATEGORY_ORDER) _catBuckets[k] = [];
    allGenres.forEach(g => {
      const cat = tax.categorize(g.name);
      (_catBuckets[cat] = _catBuckets[cat] || []).push(g);
    });
  }

  // A category is "checked" iff every genre it contains is in skipGenresSet.
  function _catChecked(catKey) {
    const items = _catBuckets[catKey] || [];
    if (!items.length) return false;
    return items.every(g => skipGenresSet.has(g.name));
  }

  function renderGenreCheckboxes() {
    const host = $("#skipGenresList");
    if (!host) return;
    const tax = window.LC_GENRE_TAXONOMY;
    if (!tax) {
      host.innerHTML = '<span style="color:#f66;font-size:11px">genre_taxonomy.js 未載入</span>';
      return;
    }

    const parts = [];
    for (const catKey of tax.CATEGORY_ORDER) {
      const items = _catBuckets[catKey] || [];
      const total = items.reduce((s, g) => s + (g.count || 0), 0);
      const empty = items.length === 0;
      const checked = _catChecked(catKey) ? ' checked' : '';
      const disabled = empty ? ' disabled' : '';
      const cls = empty ? 'gt-cat empty' : 'gt-cat';
      const catLabel = esc(tax.CATEGORY_LABEL[catKey] || catKey);
      parts.push(`<label class="${cls}" data-cat="${catKey}">
        <input type="checkbox" class="gt-cat-cb" data-cat="${catKey}"${checked}${disabled}>
        <span class="gt-cat-label">${catLabel}</span>
        <span class="gt-cat-stat">${items.length} · ${total} 首</span>
      </label>`);
    }
    host.innerHTML = parts.join("");

    host.querySelectorAll("input.gt-cat-cb").forEach(cb => {
      cb.addEventListener("change", () => {
        const cat = cb.dataset.cat;
        const items = _catBuckets[cat] || [];
        if (cb.checked) items.forEach(g => skipGenresSet.add(g.name));
        else items.forEach(g => skipGenresSet.delete(g.name));
        updateGenreSummary();
        saveAutoSettings();
      });
    });

    updateGenreSummary();
  }

  function updateGenreSummary() {
    const el = $("#skipGenresSummary");
    if (!el) return;
    const tax = window.LC_GENRE_TAXONOMY;
    if (!tax) { el.textContent = ""; return; }
    const n = tax.CATEGORY_ORDER.filter(_catChecked).length;
    el.textContent = n ? `已跳過 ${n} 大分類` : "未跳過任何類別";
  }

  async function loadGenres() {
    try {
      const r = await API.get("/api/library/genres");
      allGenres = r.genres || [];
      _rebuildBuckets();
      renderGenreCheckboxes();
    } catch {}
    finally { bumpInitProgress(); }
  }

  // ---- 載入設定 ----
  async function loadSettings() {
    try {
      const s = await API.get("/api/auto/settings");
      $("#optAutoScan").checked = s.auto_scan_enabled;
      $("#optScanInterval").value = s.auto_scan_interval_minutes;
      $("#optAutoChord").checked = s.auto_chord_enabled;
      $("#optMaxPerCycle").value = s.auto_chord_max_per_cycle;
      $("#optAutoStartOnBoot").checked = !!s.auto_start_on_boot;

      // 跳過類別：相容舊式逗號字串
      const raw = s.auto_chord_skip_genres;
      let skipList = [];
      if (Array.isArray(raw)) skipList = raw;
      else if (typeof raw === "string") skipList = raw.split(",").map(x => x.trim()).filter(Boolean);
      skipGenresSet = new Set(skipList);
      if (allGenres.length) renderGenreCheckboxes();
      else updateGenreSummary();

      // 啟用群組
      const ag = s.auto_chord_active_groups || [];
      activeGroupSet = ag.length ? new Set(ag) : null;
      if (lastGroups.length) {
        renderGroups(lastGroups, "");
      } else {
        updateGroupSummary();
      }
    } catch {}
    finally { bumpInitProgress(); }
  }
  loadSettings();
  loadGenres();

  // ---- 多音樂庫路徑管理 ----
  const rootsList = $("#musicRootsList");

  function addRootRow(value) {
    const row = document.createElement("div");
    row.style.cssText = "display:flex;gap:6px;align-items:center";
    row.innerHTML = `<input type="text" class="music-root-input" value="${esc(value || "")}" style="flex:1;padding:4px 10px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:12px" placeholder="Y:/">
      <button class="btn-remove-root" style="padding:2px 8px;border:1px solid #f44;border-radius:4px;background:transparent;color:#f44;cursor:pointer;font-size:11px">✕</button>`;
    row.querySelector(".btn-remove-root").addEventListener("click", () => {
      if (rootsList.children.length > 1) row.remove();
      else showToast("至少保留一個路徑");
    });
    rootsList.appendChild(row);
  }

  async function loadMusicRootSettings() {
    try {
      const s = await API.get("/api/settings");
      rootsList.innerHTML = "";
      const roots = s.music_roots || (s.music_root ? [s.music_root] : ["Y:/"]);
      roots.forEach(r => addRootRow(r));
    } catch { addRootRow("Y:/"); }
  }
  loadMusicRootSettings();

  $("#btnAddRoot").addEventListener("click", () => addRootRow(""));

  // 「💾 套用設定並啟動」整合：儲存路徑 → 增量掃描 → 開啟自動化 → 啟動 Core
  $("#btnApplyAndStart").addEventListener("click", async () => {
    const roots = [...rootsList.querySelectorAll(".music-root-input")]
      .map(i => i.value.trim()).filter(Boolean);
    if (!roots.length) { showToast("至少需要一個路徑"); return; }

    const btn = $("#btnApplyAndStart");
    const origText = btn.textContent;
    btn.textContent = "⚙️ 套用中...";
    btn.disabled = true;

    try {
      // 1. 儲存音樂庫路徑
      await API.post("/api/settings", { music_roots: roots });
      // 2. 強制開啟兩個自動 toggle 並儲存所有 auto 設定（含群組勾選 / 跳過類別 / 開機自啟）
      $("#optAutoScan").checked = true;
      $("#optAutoChord").checked = true;
      const activeIds = (activeGroupSet === null || activeGroupSet.size === lastGroups.length)
        ? []
        : Array.from(activeGroupSet);
      await API.post("/api/auto/settings", {
        auto_scan_enabled: true,
        auto_scan_interval_minutes: parseInt($("#optScanInterval").value) || 30,
        auto_chord_enabled: true,
        auto_chord_max_per_cycle: parseInt($("#optMaxPerCycle").value) || 20,
        auto_chord_skip_genres: Array.from(skipGenresSet),
        auto_chord_active_groups: activeIds,
        auto_start_on_boot: $("#optAutoStartOnBoot").checked,
      });
      // 3. 啟動 Core — worker 自己會在第一個 cycle 跑 incremental scan，
      //    不要在這裡額外戳 libraryScan 避免與 worker 競爭 task_lock
      const r = await API.post("/api/auto/start");
      showToast("✅ 已套用設定，Core 啟動中（首輪掃描將自動開始）");
      btn.textContent = "✅ 已就緒";
      setTimeout(() => { btn.disabled = false; btn.textContent = origText; }, 3000);
      pollStatus();
      loadGroups();
    } catch (e) {
      showToast("發生錯誤：" + e.message);
      btn.textContent = "❌ 失敗";
      setTimeout(() => { btn.disabled = false; btn.textContent = origText; }, 3000);
    }
  });

  // ---- 設定自動儲存 ----
  let saveSettingsTimer = null;
  async function saveAutoSettings() {
    clearTimeout(saveSettingsTimer);
    saveSettingsTimer = setTimeout(async () => {
      try {
        await API.post("/api/auto/settings", {
          auto_scan_enabled: $("#optAutoScan").checked,
          auto_scan_interval_minutes: parseInt($("#optScanInterval").value) || 30,
          auto_chord_enabled: $("#optAutoChord").checked,
          auto_chord_max_per_cycle: parseInt($("#optMaxPerCycle").value) || 20,
          auto_chord_skip_genres: Array.from(skipGenresSet),
          auto_start_on_boot: $("#optAutoStartOnBoot").checked,
        });
        showToast("設定已儲存");
      } catch (e) { showToast("儲存失敗: " + e.message); }
    }, 200);
  }
  $("#optAutoScan").addEventListener("change", saveAutoSettings);
  $("#optAutoChord").addEventListener("change", saveAutoSettings);
  $("#optScanInterval").addEventListener("change", saveAutoSettings);
  $("#optMaxPerCycle").addEventListener("change", saveAutoSettings);
  $("#optAutoStartOnBoot").addEventListener("change", saveAutoSettings);

  // ---- Core 停止按鈕（只負責停止；啟動由「💾 套用設定並啟動」處理）----
  let coreRunning = false;
  let _stopRequested = false;
  $("#btnCoreToggle").addEventListener("click", async () => {
    if (_stopRequested) return;
    _stopRequested = true;
    const btn = $("#btnCoreToggle");
    btn.disabled = true;
    btn.textContent = "⏳ 停止中…";
    try {
      const r = await API.post("/api/auto/stop");
      showToast(r.message || "");
    } catch (e) { showToast(e.message); }
    pollStatus();
  });

  // ---- 曲目群組 ----
  const groupsHost = $("#groupsHost");
  let lastGroups = [];
  // null = 尚未顯式設定（視為全部啟用，向下相容）；Set = 已顯式選取
  let activeGroupSet = null;

  function isGroupActive(gid) {
    return activeGroupSet === null || activeGroupSet.has(gid);
  }

  function updateGroupSummary() {
    const el = $("#optActiveGroupsSummary");
    if (!el) return;
    if (!lastGroups.length) { el.textContent = "—"; return; }
    const total = lastGroups.length;
    const active = lastGroups.filter(g => isGroupActive(g.group_id));
    const labels = active.map(g => g.label).join(", ");
    el.textContent = `${active.length}/${total}（${labels || "無"}）`;
  }

  let saveActiveGroupsTimer = null;
  function saveActiveGroupsDebounced() {
    clearTimeout(saveActiveGroupsTimer);
    saveActiveGroupsTimer = setTimeout(async () => {
      // 保存時：若全勾，存空陣列（語意 = 不過濾），否則存實際選取
      const ids = (activeGroupSet === null || activeGroupSet.size === lastGroups.length)
        ? []
        : Array.from(activeGroupSet);
      try {
        await API.post("/api/auto/settings", { auto_chord_active_groups: ids });
        showToast("群組選取已儲存");
      } catch (e) { showToast("儲存失敗: " + e.message); }
    }, 300);
  }

  function renderGroups(groups, lockKind) {
    if (!groups.length) {
      groupsHost.innerHTML = '<span style="color:var(--text-dim);font-size:12px">尚無曲目，請先設定音樂庫並執行掃描</span>';
      updateGroupSummary();
      return;
    }
    const totalTracks = groups.reduce((s, g) => s + g.track_count, 0);
    const totalDone = groups.reduce((s, g) => s + g.chords_done, 0);
    $("#groupsSummary").textContent = `${groups.length} 個群組 · ${totalDone}/${totalTracks} 首已偵測`;

    const busy = lockKind === "SCAN" || lockKind === "CHORD_BATCH";
    const rows = groups.map(g => {
      const pct = g.coverage || 0;
      const safeId = esc(g.group_id);
      const active = isGroupActive(g.group_id);
      const checked = active ? "checked" : "";
      const detectDisabled = busy || g.chords_pending === 0 || !active;
      return `<tr data-id="${safeId}">
        <td class="col-active"><input type="checkbox" class="group-active-cb" data-gid="${safeId}" ${checked}></td>
        <td class="col-root">${esc(g.root_label)}</td>
        <td class="col-label">${esc(g.label)}</td>
        <td class="col-count">${g.track_count}</td>
        <td class="col-cov"><div class="cov-bar"><div class="fill" style="width:${pct}%"></div><div class="pct">${pct}% (${g.chords_done}/${g.track_count})</div></div></td>
        <td class="col-action"><button class="btn-detect" data-id="${safeId}" ${detectDisabled ? "disabled" : ""} title="${active ? "" : "未啟用此群組"}">偵測</button></td>
      </tr>`;
    }).join("");
    groupsHost.innerHTML = `<table class="group-table">
      <thead><tr><th title="勾選 = 納入自動偵測"><input type="checkbox" id="groupActiveAllCb" title="全選 / 全不選"></th><th>音樂庫</th><th>群組</th><th>曲目</th><th>覆蓋率</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;

    // 全選 checkbox
    const allCb = $("#groupActiveAllCb");
    const allChecked = groups.every(g => isGroupActive(g.group_id));
    allCb.checked = allChecked;
    allCb.indeterminate = !allChecked && groups.some(g => isGroupActive(g.group_id));
    allCb.addEventListener("change", () => {
      activeGroupSet = allCb.checked ? new Set(groups.map(g => g.group_id)) : new Set();
      groupsHost.querySelectorAll("input.group-active-cb").forEach(cb => { cb.checked = allCb.checked; });
      updateGroupSummary();
      saveActiveGroupsDebounced();
    });

    // 即時同步：依當下勾選狀態 enable/disable 各 row 的偵測 button
    function syncDetectButtons() {
      groupsHost.querySelectorAll("tr[data-id]").forEach(tr => {
        const gid = tr.dataset.id;
        const g = groups.find(x => x.group_id === gid);
        if (!g) return;
        const btn = tr.querySelector(".btn-detect");
        if (!btn) return;
        const active = isGroupActive(gid);
        btn.disabled = busy || g.chords_pending === 0 || !active;
        btn.title = active ? "" : "未啟用此群組";
      });
    }

    // 個別 checkbox
    groupsHost.querySelectorAll("input.group-active-cb").forEach(cb => {
      cb.addEventListener("change", () => {
        // 第一次互動：把當前的「全部視為啟用」狀態具體化成 Set
        if (activeGroupSet === null) {
          activeGroupSet = new Set(groups.map(g => g.group_id));
        }
        const gid = cb.dataset.gid;
        if (cb.checked) activeGroupSet.add(gid); else activeGroupSet.delete(gid);
        // 同步全選 checkbox 狀態
        const all = groups.every(g => activeGroupSet.has(g.group_id));
        const some = groups.some(g => activeGroupSet.has(g.group_id));
        allCb.checked = all;
        allCb.indeterminate = !all && some;
        updateGroupSummary();
        syncDetectButtons();
        saveActiveGroupsDebounced();
      });
    });

    // 全選變動也要同步偵測按鈕
    allCb.addEventListener("change", syncDetectButtons);

    groupsHost.querySelectorAll(".btn-detect").forEach(b => {
      b.addEventListener("click", async () => {
        b.disabled = true;
        b.textContent = "啟動中…";
        try {
          const r = await API.batchDetect(b.dataset.id);
          if (r.ok) {
            showToast(`已啟動：${r.total} 首`);
          } else {
            showToast(r.message || "啟動失敗");
            b.disabled = false;
            b.textContent = "偵測";
          }
          pollStatus();
        } catch (e) {
          showToast(e.message);
          b.disabled = false;
          b.textContent = "偵測";
        }
      });
    });

    updateGroupSummary();
  }

  let _groupsLoadedOnce = false;
  async function loadGroups() {
    try {
      const data = await API.libraryGroups();
      lastGroups = data.groups || [];
      const ts = await API.tasksStatus().catch(() => ({ current: null }));
      renderGroups(lastGroups, ts.current ? ts.current.kind : "");
    } catch (e) {
      groupsHost.innerHTML = `<span style="color:#f66;font-size:12px">載入群組失敗：${esc(e.message)}</span>`;
    } finally {
      if (!_groupsLoadedOnce) { _groupsLoadedOnce = true; bumpInitProgress(); }
    }
  }
  loadGroups();

  // ---- 和弦管理 ----
  const trackList = $("#trackList");
  const midiStatus = $("#midiStatus");
  
  let currentPage = 1;
  let currentTotalPages = 1;

  async function loadTrackList(page = 1) {
    trackList.innerHTML = '<span style="color:var(--text-dim);font-size:12px">載入中…</span>';
    try {
      const q = $("#trackSearch").value.trim();
      const st = $("#trackStatus").value;
      const data = await API.chordTracks(page, 100, q, st);
      const tracks = data.tracks || [];
      
      currentPage = data.page || 1;
      currentTotalPages = data.total_pages || 1;
      
      $("#pageInfo").textContent = `頁 ${currentPage} / ${currentTotalPages} (共 ${data.total || 0} 首)`;
      $("#btnPrevPage").disabled = currentPage <= 1;
      $("#btnNextPage").disabled = currentPage >= currentTotalPages;

      if (!tracks.length) { trackList.innerHTML = '<span style="color:var(--text-dim);font-size:12px">無曲目</span>'; return; }
      trackList.innerHTML = tracks.map((t, i) => {
        const src = t.source || "";
        const badgeCls = src === "midi" ? "b-midi" : src === "chordify" ? "b-chordify" : src === "btc" ? "b-btc" : "b-none";
        const badgeText = t.has_chords ? `${src || "btc"} ${t.chord_count || ""}` : "—";
        const name = t.title || t.path.replace(/\.flac$/i, "");
        return `<div class="trk" data-path="${esc(t.path)}">
          <span class="trk-name" title="${esc(t.path)}">${esc(name)}</span>
          <span class="trk-artist">${esc(t.artist || "")}</span>
          <span class="trk-badge ${badgeCls}">${badgeText}</span>
          ${t.has_chords ? "" : `<button class="btn-midi-search" data-path="${esc(t.path)}">MIDI</button>`}
        </div>`;
      }).join("");

      trackList.querySelectorAll(".btn-midi-search").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          e.stopPropagation();
          const path = btn.dataset.path;
          btn.textContent = "...";
          btn.disabled = true;
          try {
            const sr = await API.midiSearch(path);
            if (sr.results && sr.results.length > 0) {
              btn.textContent = "匯入中";
              const r = await API.midiImport(path, sr.results[0].path);
              showToast(`MIDI ${r.chord_count} 和弦`);
              loadTrackList();
            } else {
              btn.textContent = "無";
              setTimeout(() => { btn.textContent = "MIDI"; btn.disabled = false; }, 2000);
            }
          } catch (err) {
            showToast("失敗: " + err.message);
            btn.textContent = "MIDI";
            btn.disabled = false;
          }
        });
      });

      // 點擊曲目跳到 player
      trackList.querySelectorAll(".trk").forEach(row => {
        row.style.cursor = "pointer";
        row.addEventListener("click", (e) => {
          if (e.target.closest("button")) return;
          window.open(`/player?path=${encodeURIComponent(row.dataset.path)}`, "_blank");
        });
      });
    } catch (err) {
      trackList.innerHTML = `<span style="color:#f66;font-size:12px">載入失敗</span>`;
    }
  }
  loadTrackList();

  $("#btnRefreshTracks").addEventListener("click", () => loadTrackList(1));
  $("#btnPrevPage").addEventListener("click", () => loadTrackList(currentPage - 1));
  $("#btnNextPage").addEventListener("click", () => loadTrackList(currentPage + 1));
  
  let trackSearchTimer;
  $("#trackSearch").addEventListener("input", () => {
    clearTimeout(trackSearchTimer);
    trackSearchTimer = setTimeout(() => loadTrackList(1), 500);
  });
  $("#trackStatus").addEventListener("change", () => loadTrackList(1));

  $("#btnBatchMidi").addEventListener("click", async () => {
    midiStatus.textContent = "匯入中…";
    try {
      const r = await API.batchMidiImport();
      midiStatus.textContent = `匯入 ${r.imported}，跳過 ${r.skipped}`;
      if (r.imported > 0) loadTrackList();
    } catch (e) { midiStatus.textContent = "失敗: " + e.message; }
  });

  // ---- 狀態輪詢 ----
  const statusMap = {
    stopped: { dot: "dot-gray", badge: "badge-stopped", text: "已停止" },
    idle: { dot: "dot-green", badge: "badge-running", text: "運行中" },
    waiting: { dot: "dot-green", badge: "badge-waiting", text: "等待中" },
    scanning: { dot: "dot-green", badge: "badge-scanning", text: "掃描中" },
    detecting: { dot: "dot-green", badge: "badge-detecting", text: "偵測中" },
    training: { dot: "dot-green", badge: "badge-detecting", text: "AI 訓練中" },
    stopping: { dot: "dot-gray", badge: "badge-stopped", text: "停止中…" },
  };

  let coreIdle = true;
  let adminStatusTimer = null;
  let lastLockKind = "";
  let _statusLoadedOnce = false;

  async function pollStatus() {
    try {
      const [core, chords, taskSt] = await Promise.all([
        API.get("/api/auto/status"),
        API.get("/api/chords/stats"),
        API.tasksStatus(),
      ]);
      if (!_statusLoadedOnce) { _statusLoadedOnce = true; bumpInitProgress(); }

      coreRunning = !!core.running;
      const cur = taskSt.current;
      const lockKind = cur ? cur.kind : "";
      coreIdle = !coreRunning && !cur;

      const isScan = lockKind === "SCAN";
      const isBatch = lockKind === "CHORD_BATCH";
      const lockTag = $("#lockTag");
      if (cur) {
        lockTag.style.display = "inline-block";
        lockTag.textContent = `${lockKind} · ${cur.scope}`;
      } else {
        lockTag.style.display = "none";
      }

      const scanTotal = chords.total_tracks || 0;
      const coveragePct = scanTotal > 0 ? Math.round(chords.tracks_with_chords / scanTotal * 1000) / 10 : 0;

      $("#sTotalTracks").textContent = scanTotal || 0;
      $("#sWithChords").textContent = chords.tracks_with_chords || 0;
      $("#sCoverage").textContent = coveragePct + "%";
      $("#sQueueSize").textContent = core.detect_queue_size || 0;

      const st = statusMap[core.status] || statusMap.stopped;
      $("#coreDot").className = "dot " + st.dot;
      const badge = $("#coreBadge");
      badge.className = "badge " + st.badge;
      badge.textContent = st.text;

      // 進度條與目前任務（優先顯示 task_lock）
      const coreBar = $("#coreBar");
      const taskLabelMap = { SCAN: "掃描", CHORD_BATCH: "和弦偵測", MIDI_IMPORT: "MIDI 匯入" };
      if (cur && cur.total) {
        // 已知總量：精確百分比
        coreBar.classList.remove("indeterminate");
        const pct = Math.round(cur.done / cur.total * 100);
        coreBar.style.width = pct + "%";
        const item = (cur.current_item || "").split("/").slice(-1)[0];
        const label = taskLabelMap[lockKind] || lockKind;
        $("#currentTask").textContent = `${label} ${cur.done}/${cur.total} · ${item}`;
      } else if (cur) {
        // 未知總量（如 incremental scan）：indeterminate 動畫 + 計數器
        coreBar.classList.add("indeterminate");
        coreBar.style.width = "100%";
        const item = (cur.current_item || "").split("/").slice(-1)[0];
        const label = taskLabelMap[lockKind] || lockKind;
        $("#currentTask").textContent = `${label}（${cur.scope}）· 已處理 ${cur.done || 0} · ${item || "…"}`;
      } else if (scanTotal > 0) {
        coreBar.classList.remove("indeterminate");
        coreBar.style.width = Math.round(chords.tracks_with_chords / scanTotal * 100) + "%";
        $("#currentTask").textContent = core.current_task || "";
      }

      // Core 停止按鈕：只在運行中顯示；停止請求已送出時顯示「停止中…」disable
      const stopBtn = $("#btnCoreToggle");
      if (coreRunning) {
        stopBtn.style.display = "";
        if (_stopRequested) {
          stopBtn.textContent = "⏳ 停止中…";
          stopBtn.disabled = true;
        } else {
          stopBtn.textContent = "⏸ 停止 Core";
          stopBtn.disabled = false;
        }
      } else {
        stopBtn.style.display = "none";
        _stopRequested = false;  // 重設狀態，下次再啟動時可正常使用
        stopBtn.disabled = false;
        stopBtn.textContent = "⏸ 停止 Core";
      }

      // 群組表：lock 狀態變化時重畫
      if (lockKind !== lastLockKind) {
        const wasBusy = !!lastLockKind;
        lastLockKind = lockKind;
        renderGroups(lastGroups, lockKind);
        // 任務剛結束 → 重新拉群組覆蓋率
        if (!lockKind && wasBusy) {
          loadGroups();
        }
      }
      // 偵測進行中也定期更新覆蓋率（每 10 首）
      if (isBatch && cur && cur.done && cur.done % 10 === 0) {
        loadGroups();
      }
    } catch {}

    try {
      // 活動記錄：不論 Core 是否運行都更新，讓使用者隨時能看歷史
      const logData = await API.get("/api/auto/log?limit=30");
      const box = $("#logBox");
      const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 30;
      box.innerHTML = (logData.log || []).map(e => {
        const cls = e.level === "OK" ? "ok" : e.level === "ERROR" ? "error" : "info";
        return `<div><span class="ts">${e.time}</span> <span class="${cls}">[${e.level}]</span> ${esc(e.msg)}</div>`;
      }).join("") || '<span class="info">無記錄</span>';
      if (atBottom) box.scrollTop = box.scrollHeight;
    } catch {}

    clearTimeout(adminStatusTimer);
    adminStatusTimer = setTimeout(pollStatus, coreIdle ? 10000 : 2000);
  }

  function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

  pollStatus();
})();
</script>
</body>
</html>

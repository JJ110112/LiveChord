<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveChord</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#e94560">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/css/base.css?v=1">
  <link rel="stylesheet" href="/css/home.css?v=5">
  <script>
    if (!localStorage.getItem("livechord_token")) {
      fetch('/api/auth/is_admin').then(r => {
        if (!r.ok) window.location.href = "/login";
      }).catch(() => {
        window.location.href = "/login";
      });
    }
  </script>
</head>
<body>

<!-- header -->
<header class="header">
  <h1>LiveChord</h1>
  <div class="search-box">
    <input id="searchInput" type="text" placeholder="搜尋歌曲、演出者、專輯…" autocomplete="off">
    <div id="searchResults" class="search-results"></div>
  </div>
  <nav style="margin-right: 32px;">
    <div style="display:flex; align-items:center; gap: 10px;">
      <span id="userGreeting" style="font-size: 0.85em; color: var(--text-muted);"></span>
      <button onclick="exportData()">匯出資料</button>
      <button onclick="logout()">登出</button>
    </div>
  </nav>
  <button class="header-fs-btn" title="全螢幕" onclick="
    if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(()=>{})}
    else{document.exitFullscreen()}
  ">&#x26F6;</button>
</header>

<!-- dashboard layout -->
<main class="content dashboard-layout">
  
  <!-- recent section -->
  <section id="secRecent" class="dash-section" style="display:none">
    <h2 class="dash-title">最近播放</h2>
    <div id="recentList" class="horizontal-scroll"></div>
  </section>

  <!-- beta recent plays (hidden by default) -->
  <section id="secBetaRecent" class="dash-section" style="display:none">
    <h2 class="dash-title">最近播放</h2>
    <div id="betaRecentList" class="horizontal-scroll"></div>
  </section>

  <!-- favorites section -->
  <section id="secFavorites" class="dash-section" style="display:none">
    <h2 class="dash-title">我的最愛</h2>
    <div id="favList" class="horizontal-scroll"></div>
  </section>

  <!-- beta library = analysis history as grid (hidden by default) -->
  <section id="secHistory" class="dash-section" style="display:none">
    <h2 class="dash-title">音樂庫</h2>
    <div id="historyGrid" class="horizontal-scroll" style="margin-top:12px"></div>
  </section>

  <!-- beta upload section — compact, at the bottom (hidden by default) -->
  <section id="secUpload" class="dash-section" style="display:none">
    <h2 class="dash-title">新增歌曲</h2>
    <div class="beta-upload-compact">
      <div class="upload-drop-zone-compact" id="betaDropZone">
        <span>&#x1F3B5; 拖曳音檔至此，或點擊選取</span>
        <span class="upload-hint">MP3, FLAC, WAV, M4A, OGG (上限 200 MB)</span>
        <input type="file" id="betaFileInput" accept="audio/*" style="display:none">
      </div>
      <div class="beta-file-info" id="betaFileInfo" style="display:none">
        <span id="betaFileName"></span>
        <span id="betaFileSize" style="color:var(--text-dim);margin-left:8px"></span>
        <button class="btn-small btn-accent" id="betaUploadBtn" onclick="window._betaStartUpload()">開始分析</button>
      </div>
      <div class="beta-progress" id="betaUploadProgress" style="display:none">
        <div class="progress-bar"><div class="progress-fill" id="betaProgressFill"></div></div>
        <div class="progress-info">
          <span id="betaProgressText">分析中...</span>
          <span id="betaProgressPct">0%</span>
        </div>
      </div>
      <div class="beta-yt-row" style="margin-top:10px">
        <div style="display:flex;gap:8px;align-items:center">
          <span>&#x1F3AC;</span>
          <input type="text" id="betaYtUrl" placeholder="貼上 YouTube URL..." style="flex:1;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:0.85rem">
          <button class="btn-small btn-accent" id="betaYtBtn" onclick="window._betaStartYoutube()">分析</button>
        </div>
        <div class="beta-progress" id="betaYtProgress" style="display:none;margin-top:8px">
          <div class="progress-bar"><div class="progress-fill" id="betaYtFill"></div></div>
          <div class="progress-info">
            <span id="betaYtText">處理中...</span>
            <span id="betaYtPct">0%</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- browse section -->
  <section id="secBrowse" class="dash-section">
    <div class="browse-header" style="position: sticky; top: 56px; z-index: 10; background: var(--bg); padding: 10px 0; display: flex; align-items: center; justify-content: space-between;">
      <h2 class="dash-title" style="display:flex; align-items:center; margin-bottom: 0;">
        音樂庫 
        <span id="breadcrumb" class="breadcrumb" style="font-size:0.65em; opacity:0.7; font-weight:normal; margin-left:12px; margin-bottom:0;"></span>
      </h2>
      <input type="text" id="dirFilter" placeholder="過濾曲目..." autocomplete="off" style="display:none; padding: 4px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text); font-size: 12px; width: 140px;">
    </div>
    <div id="browseGrid" class="grid" style="margin-top: 16px;"></div>
    <ul id="trackList" class="track-list" style="display:none; margin-top: 16px;"></ul>
  </section>

  <!-- loading -->
  <div id="loading" class="loading" style="display:none">
    <div class="spinner"></div>
    <p style="margin-top:12px">載入中…</p>
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="/js/utils.js?v=2"></script>
<script src="/js/api.js?v=57"></script>
<script>
  // Insert auth token into all fetch requests in api.js globally!
  const originalFetch = window.fetch;
  window.fetch = function() {
    let [resource, config] = arguments;
    if(config == null) config = {};
    const url = typeof resource === 'string' ? resource : (resource instanceof Request ? resource.url : '');
    if (url.startsWith('/') || url.includes(window.location.host)) {
        if(config.headers == null) config.headers = {};
        const token = localStorage.getItem("livechord_token");
        if(token) config.headers['Authorization'] = `Bearer ${token}`;
    }
    return originalFetch(resource, config);
  };
  
  let username = localStorage.getItem("livechord_username");
  
  // Check admin status anyway to handle LAN bypass
  fetch("/api/auth/is_admin")
    .then(res => res.json())
    .then(data => {
        if (data.is_admin) {
            fetch("/api/config/public").then(r => r.json()).then(cfg => {
                if (cfg.deployment_mode === "beta") {
                    // Beta mode: show admin UI
                    if (!username) username = "Admin (LAN)";
                    const greeting = document.getElementById("userGreeting");
                    if (greeting) greeting.textContent = `Hello, ${username}`;

                    const navDiv = document.querySelector("nav div");
                    if (!navDiv.querySelector("button.admin-btn")) {
                        const adminBtn = document.createElement("button");
                        adminBtn.className = "admin-btn";
                        adminBtn.textContent = "管理後台";
                        adminBtn.onclick = () => window.location.href = "/admin";
                        navDiv.insertBefore(adminBtn, navDiv.querySelector("button"));

                        const processBtn = document.createElement("button");
                        processBtn.textContent = "新歌分析";
                        processBtn.onclick = () => window.location.href = "/process";
                        navDiv.insertBefore(processBtn, navDiv.querySelector("button"));
                    }
                } else {
                    // Personal mode: hide nav entirely
                    const nav = document.querySelector("header nav");
                    if (nav) nav.style.display = "none";
                }
            }).catch(() => {});
        } else if (username) {
            const greeting = document.getElementById("userGreeting");
            if (greeting) greeting.textContent = `Hello, ${username}`;
        }
    }).catch(err => {
        if (username) {
            const greeting = document.getElementById("userGreeting");
            if (greeting) greeting.textContent = `Hello, ${username}`;
        }
    });

  function logout() {
      localStorage.removeItem("livechord_token");
      localStorage.removeItem("livechord_username");
      window.location.href = "/login";
  }

  async function exportData() {
      const token = localStorage.getItem("livechord_token");
      if (!token) return;
      try {
          const res = await fetch("/api/export-data");
          if (!res.ok) {
              alert("無資料可匯出");
              return;
          }
          const blob = await res.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.style.display = "none";
          a.href = url;
          a.download = `${localStorage.getItem("livechord_username")}_backup.zip`;
          document.body.appendChild(a);
          a.click();
          window.URL.revokeObjectURL(url);
      } catch (e) {
          alert("網路錯誤");
      }
  }
</script>
<script src="/js/app.js?v=45"></script>
</body>
</html>

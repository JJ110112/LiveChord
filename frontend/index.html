<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveChord</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>(function(){try{var t=localStorage.getItem('livechord_theme');if(/^(light|forest|sakura|sunny|sky)$/.test(t))document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="/css/base.css?v=15">
  <link rel="stylesheet" href="/css/home.css?v=22">
  <!-- Warm the CDN so the player page's YouTube IFrame bootstraps faster -->
  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="dns-prefetch" href="https://www.youtube.com">
  <script>
    if (!localStorage.getItem("livechord_token")) {
      fetch('/api/auth/is_admin').then(r => {
        if (!r.ok) window.location.href = "/login";
      }).catch(() => {
        window.location.href = "/login";
      });
    }
  </script>
</head>
<body>

<!-- header -->
<header class="header">
  <h1 class="header-brand">
    <img src="/favicon.svg?v=3" alt="" class="header-brand-icon" aria-hidden="true">
    <span>LiveChord</span>
  </h1>
  <div class="search-box">
    <input id="searchInput" type="text" placeholder="請輸入 YouTube URL..." autocomplete="off">
    <div class="search-marquee" aria-hidden="true"><span class="search-marquee-text">請輸入 YouTube URL...</span></div>
    <div id="searchResults" class="search-results"></div>
  </div>
  <nav style="margin-right: 32px;">
    <div style="display:flex; align-items:center; gap: 10px;">
      <span id="userGreeting" style="font-size: 0.85em; color: var(--text-muted);"></span>
      <button id="btnInstallApp" title="安裝為 App">📱 安裝</button>
      <button onclick="logout()">登出</button>
    </div>
  </nav>
  <button class="header-fs-btn" title="全螢幕" onclick="
    if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(()=>{})}
    else{document.exitFullscreen()}
  ">&#x26F6;</button>
</header>

<!-- dashboard layout -->
<main class="content dashboard-layout">
  
  <!-- recent section -->
  <section id="secRecent" class="dash-section" style="display:none">
    <h2 class="dash-title">最近播放</h2>
    <div id="recentList" class="horizontal-scroll"></div>
  </section>

  <!-- beta recent plays (hidden by default) -->
  <section id="secBetaRecent" class="dash-section" style="display:none">
    <h2 class="dash-title">最近播放</h2>
    <div id="betaRecentList" class="horizontal-scroll"></div>
  </section>

  <!-- favorites section -->
  <section id="secFavorites" class="dash-section" style="display:none">
    <h2 class="dash-title">我的最愛</h2>
    <div id="favList" class="horizontal-scroll"></div>
  </section>

  <!-- beta local music — user-picked files, persisted via IndexedDB + localStorage metadata -->
  <section id="secBetaLocalTracks" class="dash-section" style="display:none">
    <h2 class="dash-title" style="display:flex; align-items:center; gap:12px">
      <span>本機音樂</span>
      <button id="betaBrowseLocalBtn" class="btn-small" style="font-size:0.75rem; padding:4px 10px">+ 選取本機音檔</button>
    </h2>
    <!-- Analyzed: horizontal scroll of cover-card grid-items (like 最近播放) -->
    <div id="betaLocalAnalyzedRow" class="horizontal-scroll" style="margin-top:8px"></div>
    <!-- Pending (not yet analyzed): vertical list with 分析 button -->
    <div id="betaLocalTrackList" class="local-track-list" style="margin-top:8px"></div>
    <input type="file" id="betaLocalAudioInput" accept="audio/*" multiple style="display:none">
  </section>

  <!-- YouTube 播放清單 — user-subscribed playlists, analyze one-at-a-time -->
  <section id="secBetaPlaylists" class="dash-section" style="display:none">
    <h2 class="dash-title">YouTube 播放清單</h2>
    <div id="betaPlaylistList" class="yt-playlist-list" style="margin-top:8px"></div>
  </section>

  <!-- beta add-song modal (opened from search empty-state CTA; no standalone FAB button) -->
  <div id="betaFabBackdrop" class="add-song-backdrop"></div>
  <div id="betaFabPanel" class="beta-fab-panel add-song-modal">
    <button class="add-song-close" id="betaFabClose" aria-label="關閉">&times;</button>
    <div class="fab-panel-title">新增歌曲</div>
    <div class="fab-section" id="betaDropZone">
      <span>&#x1F3B5; 拖曳音檔或點擊選取</span>
      <span class="upload-hint">MP3, FLAC, WAV, M4A, OGG (200 MB)</span>
      <input type="file" id="betaFileInput" accept="audio/*" style="display:none">
    </div>
    <div class="beta-file-info" id="betaFileInfo" style="display:none">
      <span id="betaFileName"></span>
      <span id="betaFileSize" style="color:var(--text-dim);margin-left:8px"></span>
      <button class="btn-small btn-accent" id="betaUploadBtn" onclick="window._betaStartUpload()">分析</button>
    </div>
    <div class="beta-progress" id="betaUploadProgress" style="display:none">
      <div class="progress-bar"><div class="progress-fill" id="betaProgressFill"></div></div>
      <div class="progress-info"><span id="betaProgressText">分析中...</span><span id="betaProgressPct">0%</span></div>
    </div>
    <div id="betaYtRow" class="add-song-yt-row" style="display:flex;gap:8px;align-items:center;margin-top:10px">
      <span>&#x1F3AC;</span>
      <input type="text" id="betaYtUrl" placeholder="YouTube URL..." style="flex:1;min-width:0;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:0.85rem">
      <button class="btn-small btn-accent" id="betaYtBtn" style="flex-shrink:0" onclick="window._betaStartYoutube()">分析</button>
    </div>
    <div class="beta-progress" id="betaYtProgress" style="display:none;margin-top:8px">
      <div class="progress-bar"><div class="progress-fill" id="betaYtFill"></div></div>
      <div class="progress-info"><span id="betaYtText">處理中...</span><span id="betaYtPct">0%</span></div>
    </div>
  </div>

  <!-- browse section -->
  <section id="secBrowse" class="dash-section">
    <div class="browse-header" style="position: sticky; top: 56px; z-index: 10; background: var(--bg); padding: 10px 0; display: flex; align-items: center; justify-content: space-between;">
      <h2 class="dash-title" style="display:flex; align-items:center; margin-bottom: 0;">
        音樂庫 
        <span id="breadcrumb" class="breadcrumb" style="font-size:0.65em; opacity:0.7; font-weight:normal; margin-left:12px; margin-bottom:0;"></span>
      </h2>
      <input type="text" id="dirFilter" placeholder="過濾曲目..." autocomplete="off" style="display:none; padding: 4px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text); font-size: 12px; width: 140px;">
    </div>
    <div id="browseGrid" class="library-grid" style="margin-top: 16px;"></div>
    <ul id="trackList" class="track-list" style="display:none; margin-top: 16px;"></ul>
  </section>

  <!-- loading -->
  <div id="loading" class="loading" style="display:none">
    <div class="spinner"></div>
    <p style="margin-top:12px">載入中…</p>
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="/js/utils.js?v=6"></script>
<script src="/js/api.js?v=57"></script>
<script>
  // Insert auth token into all fetch requests in api.js globally!
  const originalFetch = window.fetch;
  window.fetch = async function() {
    let [resource, config] = arguments;
    if(config == null) config = {};
    const url = typeof resource === 'string' ? resource : (resource instanceof Request ? resource.url : '');
    if (url.startsWith('/') || url.includes(window.location.host)) {
        if(config.headers == null) config.headers = {};
        const token = localStorage.getItem("livechord_token");
        if(token) config.headers['Authorization'] = `Bearer ${token}`;
    }
    const res = await originalFetch(resource, config);
    // Stale / revoked token — clear and bounce to login so the user isn't stuck with
    // silent "無效憑證" failures on every API call (e.g. after logging in from another device).
    if (res.status === 401 && url.includes("/api/") && !url.includes("/api/auth/login")) {
      localStorage.removeItem("livechord_token");
      localStorage.removeItem("livechord_username");
      window.location.href = "/login";
    }
    return res;
  };
  
  let username = localStorage.getItem("livechord_username");
  
  // Check admin status anyway to handle LAN bypass
  fetch("/api/auth/is_admin")
    .then(res => res.json())
    .then(data => {
        if (data.is_admin) {
            fetch("/api/config/public").then(r => r.json()).then(cfg => {
                if (cfg.deployment_mode === "beta") {
                    // Beta mode: show admin UI
                    if (!username) username = "Admin (LAN)";
                    const greeting = document.getElementById("userGreeting");
                    if (greeting) greeting.textContent = `Hello, ${username}`;

                    const navDiv = document.querySelector("nav div");
                    if (!navDiv.querySelector("button.admin-btn")) {
                        const adminBtn = document.createElement("button");
                        adminBtn.className = "admin-btn";
                        adminBtn.textContent = "管理後台";
                        adminBtn.onclick = () => window.location.href = "/admin";
                        navDiv.insertBefore(adminBtn, navDiv.querySelector("button"));

                        const processBtn = document.createElement("button");
                        processBtn.textContent = "新歌分析";
                        processBtn.onclick = () => window.location.href = "/process";
                        navDiv.insertBefore(processBtn, navDiv.querySelector("button"));
                    }
                } else {
                    // Personal mode: hide nav entirely
                    const nav = document.querySelector("header nav");
                    if (nav) nav.style.display = "none";
                }
            }).catch(() => {});
        } else if (username) {
            const greeting = document.getElementById("userGreeting");
            if (greeting) greeting.textContent = `Hello, ${username}`;
        }
    }).catch(err => {
        if (username) {
            const greeting = document.getElementById("userGreeting");
            if (greeting) greeting.textContent = `Hello, ${username}`;
        }
    });

  function logout() {
      localStorage.removeItem("livechord_token");
      localStorage.removeItem("livechord_username");
      window.location.href = "/login";
  }

  // (Export-data button moved to player toolbar Tools popup — see player.js)
</script>

<script>
// ─── PWA install flow ─────────────────────────────────────────────────────
// Register service worker (required for installability on Chrome/Edge),
// then capture beforeinstallprompt so the user can trigger install from
// the header button any time — not just the browser's first-visit prompt.

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}

let _lcInstallPrompt = null;
const _btnInstall = document.getElementById("btnInstallApp");

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  _lcInstallPrompt = e;
  if (_btnInstall) _btnInstall.style.display = "inline-block";
});

window.addEventListener("appinstalled", () => {
  if (_btnInstall) _btnInstall.style.display = "none";
  _lcInstallPrompt = null;
});

if (_btnInstall) {
  _btnInstall.addEventListener("click", async () => {
    if (matchMedia("(display-mode: standalone)").matches) return;
    // Chrome/Edge path: beforeinstallprompt already captured → trigger native install
    if (_lcInstallPrompt) {
      _lcInstallPrompt.prompt();
      const { outcome } = await _lcInstallPrompt.userChoice;
      _lcInstallPrompt = null;
      if (outcome === "accepted") _btnInstall.style.display = "none";
      return;
    }
    // Fallback: no prompt event was captured — either iOS Safari (never fires
    // it), or Android Chrome before the engagement threshold. Show
    // platform-specific steps so the user isn't stuck. Default hint is
    // generic enough to cover edge cases (Firefox, in-app webview, etc.).
    const ua = navigator.userAgent;
    const isIOS = /iPhone|iPad|iPod/.test(ua) && !window.MSStream;
    const isAndroid = /Android/i.test(ua);
    let msg;
    if (isIOS) {
      msg = "iPhone / iPad 安裝步驟：\n1. 點畫面底部「分享」按鈕（方框向上箭頭）\n2. 往下滑找「加到主畫面」\n3. 右上按「新增」即可";
    } else if (isAndroid) {
      msg = "Android 安裝步驟：\n1. 點瀏覽器右上角選單「⋮」\n2. 選「安裝應用程式」或「加到主畫面」\n\n如看不到此選項，請用 Chrome 開啟；部分瀏覽器（LINE 內建、Facebook webview）不支援安裝 PWA，請改用系統瀏覽器。";
    } else {
      msg = "請在瀏覽器選單中找「加到主畫面」或「安裝應用程式」。";
    }
    alert(msg);
  });
}

// If already launched as standalone PWA, hide the install button outright
if (matchMedia("(display-mode: standalone)").matches && _btnInstall) {
  _btnInstall.style.display = "none";
}
</script>

<script src="/js/app.js?v=66"></script>
</body>
</html>

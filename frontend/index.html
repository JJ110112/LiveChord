<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveChord</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>(function(){try{var t=localStorage.getItem('livechord_theme');if(/^(light|forest|sakura|sunny|sky)$/.test(t))document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="/css/base.css?v=20">
  <link rel="stylesheet" href="/css/home.css?v=24">
  <link rel="stylesheet" href="/css/help.css?v=3">
  <!-- Warm the CDN so the player page's YouTube IFrame bootstraps faster -->
  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="dns-prefetch" href="https://www.youtube.com">
  <!-- Phase A: shared auth + fetch wrapper. Mints anon X-Anon-Id, injects
       Authorization for logged-in users, mode-aware 401 handling. Replaces
       the inline blind-redirect block. Must load synchronously before any
       other /api/ call. -->
  <script src="/js/auth.js?v=4"></script>
  <!-- Phase C: i18n. Loads translation dict (en default, zh-TW available),
       patches [data-i18n] / [data-i18n-attr] nodes on DOMContentLoaded. -->
  <script src="/js/i18n.js?v=16"></script>
</head>
<body>

<!-- header -->
<header class="header">
  <h1 class="header-brand">
    <img src="/favicon.svg?v=3" alt="" class="header-brand-icon" aria-hidden="true">
    <span>LiveChord</span>
  </h1>
  <div class="search-box">
    <input id="searchInput" type="text"
           data-i18n-attr="placeholder=common.search_placeholder_short"
           placeholder="Paste a YouTube URL..." autocomplete="off">
    <div class="search-marquee" aria-hidden="true"><span class="search-marquee-text" data-i18n="common.search_placeholder_short">請輸入 YouTube URL...</span></div>
    <div id="searchResults" class="search-results"></div>
  </div>
  <a href="/sponsor" class="header-coffee-btn" id="btnHeaderCoffee"
     data-i18n-attr="title=help.nav.sponsor,aria-label=help.nav.sponsor" title="贊助" aria-label="贊助">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="22" height="22">
      <path d="M17 8h1a4 4 0 1 1 0 8h-1"/>
      <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/>
      <line x1="6" y1="2" x2="6" y2="4"/>
      <line x1="10" y1="2" x2="10" y2="4"/>
      <line x1="14" y1="2" x2="14" y2="4"/>
    </svg>
  </a>
  <nav class="header-nav" aria-label="Settings">
    <div class="header-nav-inner" role="menu">
      <div class="hn-greeting" id="userGreeting" aria-hidden="true"></div>
      <div class="hn-section">
        <div class="hn-section-title" data-i18n="player.tools.theme_label">主題</div>
        <div class="hn-theme-grid">
          <button class="hn-theme-opt" data-pick="dark"   data-i18n-attr="title=player.tools.theme.dark_title"   title="深色 — 預設"   aria-label="深色主題">
            <span class="hn-theme-swatch" style="background:linear-gradient(135deg,#1a1a2e 0%,#222 100%)"></span>
            <span class="hn-theme-name" data-i18n="player.tools.theme.dark">深色</span>
          </button>
          <button class="hn-theme-opt" data-pick="light"  data-i18n-attr="title=player.tools.theme.light_title"  title="淡色 — 暖白紙"  aria-label="淡色主題">
            <span class="hn-theme-swatch" style="background:linear-gradient(135deg,#f7f5f0 0%,#e8e3d8 100%)"></span>
            <span class="hn-theme-name" data-i18n="player.tools.theme.light">淡色</span>
          </button>
          <button class="hn-theme-opt" data-pick="forest" data-i18n-attr="title=player.tools.theme.forest_title" title="森林 — 深森綠 + 警示橘" aria-label="森林主題">
            <span class="hn-theme-swatch" style="background:linear-gradient(135deg,#0d2818 0%,#ff6b35 100%)"></span>
            <span class="hn-theme-name" data-i18n="player.tools.theme.forest">森林</span>
          </button>
          <button class="hn-theme-opt" data-pick="sakura" data-i18n-attr="title=player.tools.theme.sakura_title" title="櫻夢 — 暖米色 + 玫瑰粉" aria-label="櫻夢主題">
            <span class="hn-theme-swatch" style="background:linear-gradient(135deg,#fef5f7 0%,#ec4899 100%)"></span>
            <span class="hn-theme-name" data-i18n="player.tools.theme.sakura">櫻夢</span>
          </button>

            <span class="hn-theme-swatch" style="background:linear-gradient(135deg,#fff8e1 0%,#0891b2 100%)"></span>
            <span class="hn-theme-name" data-i18n="player.tools.theme.sunny">沙灘</span>
          </button>
          <button class="hn-theme-opt" data-pick="sky"    data-i18n-attr="title=player.tools.theme.sky_title"    title="藍天白雲 — 淺藍 + 陽光黃" aria-label="藍天白雲主題">
            <span class="hn-theme-swatch" style="background:linear-gradient(135deg,#dbeafe 0%,#2563eb 100%)"></span>

<script src="/js/utils.js?v=8"></script>
<script src="/js/api.js?v=58"></script>
<script>
  // (Fetch wrapper + 401 handler are installed by /js/auth.js — see <head>.)

  function _t(key, vars, fb) {
    return window.LiveChordI18n ? window.LiveChordI18n.t(key, vars) : (fb || key);
  }

  // Display name preferred over the opaque OAuth-derived username
  // ("oauth_google_a1b2c3d4"). Falls back to username if no display_name was
  // captured (legacy session) until auth.js's /me backfill arrives.
  function _displayName() {
    return localStorage.getItem("livechord_display_name") ||
           localStorage.getItem("livechord_username") || "";
  }

  function _renderGreeting() {
    const greeting = document.getElementById("userGreeting");
    if (!greeting) return;
    const name = _displayName();
    if (!name) { greeting.textContent = ""; return; }
    greeting.textContent = _t("home.greeting", {name}, `Hello, ${name}`);
  }

  // Re-paint when auth.js backfills display_name from /api/auth/oauth/me.
  document.addEventListener("livechord:profile", _renderGreeting);
  // Re-paint on language toggle so the "Hello," prefix flips between locales.
  document.addEventListener("livechord:langchange", _renderGreeting);
  // Re-paint once the i18n dictionary finishes loading. Without this, a cold
  // reload that already has a cached display_name renders the literal key
  // "home.greeting" because _t() runs before the dict is in memory.
  document.addEventListener("livechord:i18nready", _renderGreeting);
  // Initial paint with whatever t() can resolve right now (English fallback if
  // the dict isn't loaded yet) so the user never sees "home.greeting" between
  // first paint and the i18nready event.
  _renderGreeting();

  // Theme picker — moved from player.html Tools popup into the homepage gear
  // menu (theme is a global setting and the gear is the canonical app-settings
  // entry point). Mirrors player.js's _applyTheme() so the persisted choice is
  // honored consistently across pages.
  (function() {
    const VALID = new Set(["dark", "light", "forest", "sakura", "sunny", "sky"]);
    const META = { dark: "#1a1a2e", light: "#f7f5f0", forest: "#0d2818",
                   sakura: "#fef5f7", sunny: "#fff8e1", sky: "#dbeafe" };
    function apply(theme) {
      if (!VALID.has(theme)) theme = "dark";
      document.documentElement.setAttribute("data-theme", theme);
      try { localStorage.setItem("livechord_theme", theme); } catch (_) {}
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", META[theme]);
      document.querySelectorAll(".hn-theme-opt").forEach(b => {
        b.classList.toggle("active", b.dataset.pick === theme);
      });
    }
    document.querySelectorAll(".hn-theme-opt").forEach(btn => {
      btn.addEventListener("click", () => apply(btn.dataset.pick));
    });
    let cur = localStorage.getItem("livechord_theme");
    apply(VALID.has(cur) ? cur : "dark");
  })();

  // Close the settings popover when the user taps outside of it (any click that
  // is not on the gear trigger or inside the open menu collapses it). Without
  // this the menu only closes via a second tap on the gear, which feels sticky.
  document.addEventListener("click", (e) => {
    const nav = document.querySelector(".header-nav.mobile-open");
    const gear = document.getElementById("btnHeaderSettings");
    if (!nav) return;
    if (gear && (gear === e.target || gear.contains(e.target))) return;
    if (nav.contains(e.target)) return;
    nav.classList.remove("mobile-open");
    if (gear) gear.setAttribute("aria-expanded", "false");
  });

  let username = localStorage.getItem("livechord_username");

  // Check admin status anyway to handle LAN bypass
  fetch("/api/auth/is_admin")
    .then(res => res.json())
    .then(data => {
        if (data.is_admin) {
            fetch("/api/config/public").then(r => r.json()).then(cfg => {
                if (cfg.deployment_mode === "beta" || cfg.deployment_mode === "public") {
                    // User-facing modes: show admin UI for authenticated admins
                    if (!username) username = "Admin (LAN)";
                    _renderGreeting();

                    const navDiv = document.querySelector("nav div");
                    if (!navDiv.querySelector("button.admin-btn")) {
                        const adminBtn = document.createElement("button");
                        adminBtn.className = "admin-btn";
                        adminBtn.setAttribute("data-i18n", "home.admin_btn");
                        adminBtn.textContent = _t("home.admin_btn", null, "Admin");
                        adminBtn.onclick = () => window.location.href = "/admin";
                        navDiv.insertBefore(adminBtn, navDiv.querySelector("button"));

                        const processBtn = document.createElement("button");
                        processBtn.setAttribute("data-i18n", "home.process_btn");
                        processBtn.textContent = _t("home.process_btn", null, "Analyze song");
                        processBtn.onclick = () => window.location.href = "/process";
                        navDiv.insertBefore(processBtn, navDiv.querySelector("button"));
                    }
                } else {
                    // Personal mode: nav stays visible — Phase A introduced a
                    // language picker + a meaningful logout (real OAuth users
                    // do exist in the post-beta DB), so we no longer blanket-
                    // hide the whole bar like in the beta-era design.
                    if (!username) username = "Admin (LAN)";
                    _renderGreeting();
                }
            }).catch(() => {});
        } else if (username) {
            _renderGreeting();
        }
    }).catch(err => {
        if (username) {
            _renderGreeting();
        }
    });

  function logout() {
      localStorage.removeItem("livechord_token");
      localStorage.removeItem("livechord_username");
      localStorage.removeItem("livechord_display_name");
      // Personal mode falls back to LAN bypass on /, no login page needed.
      // Beta / public still bounce to /login so the user picks an auth path.
      const mode = (window._lcDeploymentMode) ||
                   localStorage.getItem("livechord_mode_hint") || "";
      window.location.href = (mode === "personal") ? "/" : "/login";
  }

  // (Export-data button moved to player toolbar Tools popup — see player.js)
</script>

<script>
// ─── PWA install flow ─────────────────────────────────────────────────────
// Register service worker (required for installability on Chrome/Edge),
// then capture beforeinstallprompt so the user can trigger install from
// the header button any time — not just the browser's first-visit prompt.

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}

let _lcInstallPrompt = null;
const _btnInstall = document.getElementById("btnInstallApp");

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  _lcInstallPrompt = e;
  if (_btnInstall) _btnInstall.style.display = "inline-block";
});

window.addEventListener("appinstalled", () => {
  if (_btnInstall) _btnInstall.style.display = "none";
  _lcInstallPrompt = null;
});

if (_btnInstall) {
  _btnInstall.addEventListener("click", async () => {
    if (matchMedia("(display-mode: standalone)").matches) return;
    // Chrome/Edge path: beforeinstallprompt already captured → trigger native install
    if (_lcInstallPrompt) {
      _lcInstallPrompt.prompt();
      const { outcome } = await _lcInstallPrompt.userChoice;
      _lcInstallPrompt = null;
      if (outcome === "accepted") _btnInstall.style.display = "none";
      return;
    }
    // Fallback: no prompt event was captured — either iOS Safari (never fires
    // it), or Android Chrome before the engagement threshold. Show
    // platform-specific steps so the user isn't stuck. Default hint is
    // generic enough to cover edge cases (Firefox, in-app webview, etc.).
    const ua = navigator.userAgent;
    const isIOS = /iPhone|iPad|iPod/.test(ua) && !window.MSStream;
    const isAndroid = /Android/i.test(ua);
    let msg;
    if (isIOS) {
      msg = _t("install.ios", null,
        "iPhone / iPad install:\n1. Tap the Share button (square with up arrow) at the bottom\n2. Scroll down to 'Add to Home Screen'\n3. Tap 'Add' at the top right");
    } else if (isAndroid) {
      msg = _t("install.android", null,
        "Android install:\n1. Open the browser menu (⋮ at the top right)\n2. Pick 'Install app' or 'Add to Home screen'\n\nIf you don't see the option, open in Chrome — some browsers (LINE built-in, Facebook webview) can't install PWAs.");
    } else {
      msg = _t("install.fallback", null,
        "Look for 'Add to Home screen' or 'Install app' in the browser menu.");
    }
    alert(msg);
  });
}

// If already launched as standalone PWA, hide the install button outright
if (matchMedia("(display-mode: standalone)").matches && _btnInstall) {
  _btnInstall.style.display = "none";
}
</script>

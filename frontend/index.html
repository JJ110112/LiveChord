<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveChord</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#e94560">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/css/base.css?v=1">
  <link rel="stylesheet" href="/css/home.css?v=1">
  <script>
    if (!localStorage.getItem("livechord_token")) {
      window.location.href = "/login";
    }
  </script>
</head>
<body>

<!-- header -->
<header class="header">
  <h1>LiveChord</h1>
  <div class="search-box">
    <input id="searchInput" type="text" placeholder="搜尋歌曲、演出者、專輯…" autocomplete="off">
    <div id="searchResults" class="search-results"></div>
  </div>
  <nav>
    <div style="display:flex; align-items:center; gap: 10px;">
      <span id="userGreeting" style="font-size: 0.85em; color: var(--text-muted);"></span>
      <button onclick="exportData()" class="header-fs-btn" style="font-size: 0.85em;">匯出資料</button>
      <button onclick="logout()" class="header-fs-btn" style="font-size: 0.85em;">登出</button>
    </div>
  </nav>
  <button class="header-fs-btn" title="全螢幕" onclick="
    if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(()=>{})}
    else{document.exitFullscreen()}
  ">&#x26F6;</button>
</header>

<!-- dashboard layout -->
<main class="content dashboard-layout">
  
  <!-- recent section -->
  <section id="secRecent" class="dash-section" style="display:none">
    <h2 class="dash-title">最近播放</h2>
    <div id="recentList" class="horizontal-scroll"></div>
  </section>

  <!-- favorites section -->
  <section id="secFavorites" class="dash-section" style="display:none">
    <h2 class="dash-title">我的最愛</h2>
    <div id="favList" class="horizontal-scroll"></div>
  </section>

  <!-- browse section -->
  <section id="secBrowse" class="dash-section">
    <h2 class="dash-title" style="display:flex; align-items:center;">
      音樂庫 
      <span id="breadcrumb" class="breadcrumb" style="font-size:0.65em; opacity:0.7; font-weight:normal; margin-left:12px; margin-bottom:0;"></span>
    </h2>
    <div id="browseGrid" class="grid"></div>
    <ul id="trackList" class="track-list" style="display:none"></ul>
  </section>

  <!-- loading -->
  <div id="loading" class="loading" style="display:none">
    <div class="spinner"></div>
    <p style="margin-top:12px">載入中…</p>
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="/js/utils.js?v=1"></script>
<script src="/js/api.js?v=36"></script>
<script>
  // Insert auth token into all fetch requests in api.js globally!
  const originalFetch = window.fetch;
  window.fetch = function() {
    let [resource, config] = arguments;
    if(config == null) {
        config = {};
    }
    if(config.headers == null) {
        config.headers = {};
    }
    const token = localStorage.getItem("livechord_token");
    if(token) {
        config.headers['Authorization'] = `Bearer ${token}`;
    }
    return originalFetch(resource, config);
  };
  
  const username = localStorage.getItem("livechord_username");
  if (username) {
      const greeting = document.getElementById("userGreeting");
      if (greeting) greeting.textContent = `Hello, ${username}`;
  }

  function logout() {
      localStorage.removeItem("livechord_token");
      localStorage.removeItem("livechord_username");
      window.location.href = "/login";
  }

  async function exportData() {
      const token = localStorage.getItem("livechord_token");
      if (!token) return;
      try {
          const res = await fetch("/api/export-data");
          if (!res.ok) {
              alert("無資料可匯出");
              return;
          }
          const blob = await res.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.style.display = "none";
          a.href = url;
          a.download = `${localStorage.getItem("livechord_username")}_backup.zip`;
          document.body.appendChild(a);
          a.click();
          window.URL.revokeObjectURL(url);
      } catch (e) {
          alert("網路錯誤");
      }
  }
</script>
<script src="/js/app.js?v=36"></script>
</body>
</html>

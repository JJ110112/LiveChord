<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveChord</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#e94560">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/css/style.css?v=36">
</head>
<body>

<!-- header -->
<header class="header">
  <h1>LiveChord</h1>
  <div class="search-box">
    <input id="searchInput" type="text" placeholder="搜尋歌曲、演出者、專輯…" autocomplete="off">
    <div id="searchResults" class="search-results"></div>
  </div>
  <nav></nav>
  <button class="header-fs-btn" title="全螢幕" onclick="
    if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(()=>{})}
    else{document.exitFullscreen()}
  ">&#x26F6;</button>
</header>

<!-- dashboard layout -->
<main class="content dashboard-layout">
  
  <!-- recent section -->
  <section id="secRecent" class="dash-section" style="display:none">
    <h2 class="dash-title">最近播放</h2>
    <div id="recentList" class="horizontal-scroll"></div>
  </section>

  <!-- favorites section -->
  <section id="secFavorites" class="dash-section" style="display:none">
    <h2 class="dash-title">我的最愛</h2>
    <div id="favList" class="horizontal-scroll"></div>
  </section>

  <!-- browse section -->
  <section id="secBrowse" class="dash-section">
    <h2 class="dash-title" style="display:flex; align-items:center;">
      音樂庫 
      <span id="breadcrumb" class="breadcrumb" style="font-size:0.65em; opacity:0.7; font-weight:normal; margin-left:12px; margin-bottom:0;"></span>
    </h2>
    <div id="browseGrid" class="grid"></div>
    <ul id="trackList" class="track-list" style="display:none"></ul>
  </section>

  <!-- loading -->
  <div id="loading" class="loading" style="display:none">
    <div class="spinner"></div>
    <p style="margin-top:12px">載入中…</p>
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="/js/api.js?v=36"></script>
<script src="/js/app.js?v=36"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="login.title_tag">LiveChord — Sign in</title>
  <link rel="icon" href="/favicon.svg?v=4" type="image/svg+xml">
  <link rel="canonical" href="https://livechord.org/login">
  <script>(function(){try{var t=localStorage.getItem('livechord_theme');if(/^(light|forest|sakura|sunny|sky)$/.test(t))document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <!-- Phase A shared fetch wrapper. Loaded BEFORE any /api/ call so anon
       X-Anon-Id is in place + 401 from password endpoints in public mode
       doesn't bounce-loop. -->
  <script src="/js/auth.js?v=7"></script>
  <script src="/js/i18n.js?v=58"></script>
  <link rel="stylesheet" href="/css/base.css?v=6">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: var(--bg);
      margin: 0;
      color: var(--text);
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
    }

    .auth-container {
      background: transparent;
      padding: 1.5rem 1rem;
      width: 100%;
      max-width: 400px;
      position: relative;
    }

    h1 {
      text-align: center;
      margin-bottom: 0.5rem;
      color: var(--accent);
      font-size: 2rem;
      letter-spacing: -0.5px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-dim);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    /* OAuth buttons (public mode) */
    .oauth-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .oauth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, transform 0.15s;
      box-sizing: border-box;
    }

    .oauth-btn:hover {
      background: rgba(255, 255, 255, 0.07);
      transform: translateY(-1px);
    }

    .oauth-btn[disabled],
    .oauth-btn.disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .oauth-btn .oauth-icon {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
    }

    .oauth-btn-google { background: #fff; color: #1f1f1f; border-color: #dadce0; }
    .oauth-btn-google:hover { background: #f5f5f5; }
    .oauth-btn-discord { background: #5865F2; color: #fff; border-color: #5865F2; }
    .oauth-btn-discord:hover { background: #4752c4; }

    .guest-row {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .guest-row a {
      color: var(--accent);
      text-decoration: none;
    }

    .guest-row a:hover { text-decoration: underline; }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.5rem 0 1rem;
      color: var(--text-dim);
      font-size: 0.8rem;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      border-top: 1px solid var(--border);
    }

    /* Legacy password form (personal/beta) */
    .tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

    .tab {
      flex: 1;
      text-align: center;
      cursor: pointer;
      padding: 0.5rem;
      font-weight: 500;
      color: var(--text-dim);
      transition: all 0.3s ease;
      position: relative;
    }

    .tab.active { color: var(--accent); }
    .tab.active::after {
      content: '';
      position: absolute;
      bottom: -9px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--accent);
      border-radius: 2px 2px 0 0;
    }

    .form-group { margin-bottom: 1.5rem; }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-dim);
      font-size: 0.875rem;
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(33, 150, 243, 0.2);
    }
    .btn {
      width: 100%;
      padding: 0.875rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(33, 150, 243, 0.3);
    }
    .btn:hover {
      background: var(--accent-dim);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(33, 150, 243, 0.4);
    }

    .error-msg {
      color: #ff5252;
      font-size: 0.875rem;
      text-align: center;
      margin-top: 1rem;
      min-height: 1.2rem;
    }

    .hidden { display: none !important; }
  </style>
<script src="/js/analytics.js?v=3"></script>
</head>
<body>

  <div class="auth-container">
    <h1 data-i18n="common.brand">LiveChord</h1>
    <div class="subtitle" id="subtitle" data-i18n="login.subtitle.public">Sign in to unlock favorites and ratings</div>

    <!-- ── Public mode: OAuth buttons (default visible; hidden by JS if not public) ── -->
    <div id="oauth-section">
      <div class="oauth-list" id="oauth-list">
        <a class="oauth-btn oauth-btn-google" href="/api/auth/oauth/google/start" data-provider="google">
          <svg class="oauth-icon" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
            <path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
            <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
            <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
          </svg>
          <span data-i18n="login.btn_google">Continue with Google</span>
        </a>
        <a class="oauth-btn oauth-btn-discord" href="/api/auth/oauth/discord/start" data-provider="discord">
          <svg class="oauth-icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
            <path d="M20.317 4.369A19.79 19.79 0 0 0 16.558 3.2a.074.074 0 0 0-.079.037 13.7 13.7 0 0 0-.608 1.249 18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.249.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 5.93 4.369a.07.07 0 0 0-.032.027C2.625 9.046 1.71 13.58 2.157 18.057a.082.082 0 0 0 .031.056 19.91 19.91 0 0 0 5.993 3.03.078.078 0 0 0 .084-.027 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.105 13.13 13.13 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.371-.291a.074.074 0 0 1 .078-.011c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .079.01c.12.099.245.198.372.292a.077.077 0 0 1-.006.128 12.32 12.32 0 0 1-1.873.891.077.077 0 0 0-.041.106c.36.698.772 1.362 1.225 1.993a.077.077 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.331c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.955 2.418-2.157 2.418zm7.974 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
          </svg>
          <span data-i18n="login.btn_discord">Continue with Discord</span>
        </a>
      </div>
      <div class="guest-row">
        <a href="/?upload=1" id="guest-link" data-i18n="login.guest_link"
           onclick="try { localStorage.setItem('livechord_guest_acked', '1'); } catch (e) {}">Continue as guest →</a>
      </div>
    </div>

    <!-- ── Personal/Beta mode: legacy password sign-in (hidden by JS in public mode).
         Register tab removed post-beta — the only registration path is OAuth
         in public mode, plus the seeded admin row in personal mode. ── -->
    <div id="legacy-section" class="hidden">
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label data-i18n="login.field.username">Username</label>
          <input type="text" id="login-username" required
                 data-i18n-attr="placeholder=login.field.username_placeholder"
                 placeholder="e.g. Eric">
        </div>
        <div class="form-group">
          <label data-i18n="login.field.password">Password</label>
          <input type="password" id="login-password" required
                 data-i18n-attr="placeholder=login.field.password_placeholder"
                 placeholder="Your password">
        </div>
        <button type="submit" class="btn" data-i18n="login.btn_signin">Sign in</button>
      </form>
    </div>

    <div class="error-msg" id="error-msg"></div>
  </div>

  <script>
    // If already signed in, bounce to home.
    if (localStorage.getItem("livechord_token")) {
      window.location.href = "/";
    }

    // i18n helper: t(key, vars) with fallback if i18n.js hasn't booted yet.
    function _tr(key, vars, fb) {
      if (window.LiveChordI18n) return window.LiveChordI18n.t(key, vars);
      return fb || key;
    }

    // Surface OAuth callback errors (`/login?oauth_error=1&p=google`).
    (function _showOAuthError() {
      const params = new URLSearchParams(location.search);
      if (params.get("oauth_error") === "1") {
        const provider = params.get("p") || "OAuth";
        const err = document.getElementById("error-msg");
        const apply = () => {
          err.textContent = _tr(
            "login.error.oauth", { provider },
            `Sign-in failed (${provider}). Please retry or pick another method.`
          );
        };
        apply();
        document.addEventListener("livechord:i18nready", apply);
        document.addEventListener("livechord:langchange", apply);
      }
    })();

    // Mode-aware UI swap. Default markup shows OAuth section; hide it for
    // personal/beta and reveal the legacy password form instead. /api/config/public
    // is unauthenticated so it works for any caller.
    fetch("/api/config/public").then(r => r.json()).then(cfg => {
      const mode = (cfg && cfg.deployment_mode) || "personal";
      try { localStorage.setItem("livechord_mode_hint", mode); } catch (e) {}
      if (mode !== "public") {
        document.getElementById("oauth-section").classList.add("hidden");
        document.getElementById("legacy-section").classList.remove("hidden");
        const subKey = mode === "beta" ? "login.subtitle.beta" : "login.subtitle.personal";
        const sub = document.getElementById("subtitle");
        sub.setAttribute("data-i18n", subKey);
        sub.textContent = _tr(
          subKey, null,
          mode === "beta" ? "Beta account sign-in" : "Admin sign-in"
        );
      } else {
        // Public: hide providers without configured credentials by querying
        // /api/auth/oauth/providers.
        fetch("/api/auth/oauth/providers")
          .then(r => r.json())
          .then(d => {
            const enabled = new Set(d.providers || []);
            document.querySelectorAll("#oauth-list .oauth-btn[data-provider]")
              .forEach(btn => {
                const p = btn.getAttribute("data-provider");
                if (!enabled.has(p)) btn.classList.add("hidden");
              });
          })
          .catch(() => {});
      }
    }).catch(() => {
      // Failed to read mode → show legacy form as the safer default.
      document.getElementById("oauth-section").classList.add("hidden");
      document.getElementById("legacy-section").classList.remove("hidden");
    });

    async function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById("login-username").value;
      const p = document.getElementById("login-password").value;
      const err = document.getElementById("error-msg");

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();

        if (data.ok) {
          localStorage.setItem("livechord_token", data.token);
          localStorage.setItem("livechord_username", data.username);
          window.location.href = "/";
        } else {
          err.textContent = data.detail || _tr("login.error.signin", null, "Sign-in failed");
        }
      } catch (e) {
        err.textContent = _tr("login.error.network", null, "Network error");
      }
    }

  </script>
</body>
</html>

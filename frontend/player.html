<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=3.0, user-scalable=yes">
  <title>LiveChord — 播放</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#e94560">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/css/base.css?v=2">
  <link rel="stylesheet" href="/css/player.css?v=5">
  <script>
    if (!localStorage.getItem("livechord_token")) {
      window.location.href = "/login";
    }
  </script>
</head>
<body>

<!-- ===== TOP: Top Bar ===== -->
<header class="player-topbar">
  <a href="/" class="topbar-logo" title="返回首頁">LiveChord</a>
  <div class="topbar-center">
    <span id="songTitle" class="topbar-title" title="">—</span>
    <button id="btnFav" class="topbar-btn btn-fav" title="收藏">&#x2661;</button>
    <div id="topbarSearch" class="topbar-search" style="display:none">
      <input id="searchInput" type="text" placeholder="搜尋歌曲、演出者、專輯…" autocomplete="off">
      <div id="searchResults" class="search-results"></div>
    </div>
  </div>
  <div class="topbar-right">
    <div id="versionsContainer" class="versions-dropdown" style="display:none">
      <button id="btnVersionsToggle" class="btn-version">
        <span id="currentVersionName">官方 AI 版</span> 
        <span style="font-size:10px">▼</span>
      </button>
      <div id="versionsList" class="versions-list">
        <div class="versions-header">
          Edits
          <div class="versions-subtitle">Check out how other users improved the chords of this song.</div>
        </div>
        <div id="versionsItems"></div>
      </div>
    </div>
    <span id="chordBpm" class="topbar-key" style="color:var(--text-dim); margin-right:6px;"></span>
    <span id="chordSource" class="chord-source-badge"></span>
    <span id="chordKey" class="topbar-key"></span>
    <button id="btnRateAiTop" class="topbar-btn" style="color:#ff5722" title="和弦品質評論">&#x2B50;</button>
    <button id="btnPageFs" class="topbar-btn" title="全螢幕">&#x26F6;</button>
  </div>
</header>

<!-- ===== MIDDLE: Main Display Area ===== -->
<div id="chordDisplay" class="chord-display-area">

  <!-- 偵測中覆蓋層 -->
  <div id="detectOverlay" class="detect-overlay" style="display:none">
    <div class="detect-box">
      <div id="loadingSpinner" class="spinner" style="margin-bottom:12px; margin-left:auto; margin-right:auto;"></div>
      <div id="musicBarsAnim" class="music-bars" style="display:none; margin-bottom:16px;">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>
      <div id="detectMsg" style="font-size:15px;margin-bottom:8px;font-weight:bold;">正在偵測和弦…</div>
      <div id="detectDetail" style="font-size:12px;color:var(--text-dim)">首次播放需要分析音訊，請稍候</div>
    </div>
  </div>

  <!-- Split layout: Chord Ribbon | Resize Handle | Instrument View -->
  <div id="chordDisplayScaleTarget" class="middle-split">

    <!-- LEFT: Unified Chord Ribbon (replaces Overview) -->
    <div id="chordRibbonPanel" class="chord-ribbon-panel">
      <div id="unifiedRibbonTrack" class="ribbon-v-track"></div>
      <div class="ribbon-scale-bar">
        <div class="tb-item" id="tbRibbonScale">
          <button class="tb-trigger" title="和弦圖大小" style="font-size:13px">&#x1F50D;</button>
          <div class="tb-popup" style="bottom:calc(100% + 4px)">
            <button id="btnScaleDown" class="scale-btn" title="縮小">−</button>
            <span id="scaleLabel" class="scale-label">0.6</span>
            <button id="btnScaleUp" class="scale-btn" title="放大">+</button>
          </div>
        </div>
        <!-- 獨立的 Overview Toggle Button 放在放大鏡外側更顯眼 -->
        <div class="tb-item" style="margin-left: 4px;">
          <button id="btnToggleOverview" class="tb-trigger" title="切換總覽模式" style="font-size:14px; border:1px solid rgba(255,255,255,0.1); border-radius:4px; padding:2px 8px; color:#4fc3f7;">&#x1F5D0; 總覽</button>
        </div>
      </div>
    </div>

    <!-- RESIZE HANDLE with toggle button -->
    <div id="resizeHandle" class="resize-handle">
      <button id="btnToggleRibbon" class="ribbon-toggle-btn" title="顯示/隱藏和弦列表">&#x276E;</button>
    </div>

    <!-- RIGHT: Instrument Panel -->
    <div id="instrumentPanel" class="instrument-panel">

      <!-- Piano Tab -->
      <div id="chordDisplayPiano" class="chord-piano-tab" style="display:none">
        <div id="pianoWaterfallView" class="chord-88-keys">
          <canvas id="waterfallCanvas" class="waterfall-canvas"></canvas>
          <canvas id="piano88Canvas"></canvas>
        </div>
      </div>

      <!-- Guitar Tab -->
      <div id="chordDisplayGuitar" class="chord-guitar-tab" style="display:none">
        <div class="gt-teaching-layout">
          <!-- LEFT: Vertical Fretboard (Left Hand) -->
          <div class="gt-left-panel">
            <div class="gt-compact-bar">
              <span id="gtChordName" class="gt-main-chord-name">—</span>
              <div class="gt-voicing-row" id="gtVoicingRow"></div>
            </div>
            <canvas id="guitarVerticalFretboard"></canvas>
            <div class="gt-finger-legend">
              <span class="gt-fl" style="color:#ef5350">① 食指</span>
              <span class="gt-fl" style="color:#ff9800">② 中指</span>
              <span class="gt-fl" style="color:#ffeb3b">③ 無名指</span>
              <span class="gt-fl" style="color:#66bb6a">④ 小指</span>
            </div>
            <div id="gtLhHint" class="gt-panel-hint">左手：按住和弦</div>
          </div>
          <!-- MIDDLE: Line -->
          <div class="gt-mid-line"></div>
          <!-- RIGHT: Right-Hand Waterfall -->
          <div class="gt-right-panel">
            <div class="gt-compact-bar" id="gtArpSelector" style="display:none">
              <select id="gtArpPattern" class="gt-arp-select" title="琶音指法 Pattern">
                <optgroup label="Classical">
                  <option value="pima">p-i-m-a</option>
                  <option value="pimami">p-i-m-a-m-i</option>
                  <option value="pami">p-a-m-i</option>
                  <option value="pima_chord">p + ima</option>
                </optgroup>
                <optgroup label="Travis">
                  <option value="travis_basic">Travis Basic</option>
                  <option value="travis_pinch">Travis Pinch</option>
                </optgroup>
                <optgroup label="Folk / Pop">
                  <option value="folk_44">Folk 4/4</option>
                  <option value="pop_ballad">Pop Ballad</option>
                </optgroup>
              </select>
            </div>
            <div id="gtRhStyleLabel" class="gt-compact-bar" style="display:none">
              <span class="gt-rh-style-name">—</span>
            </div>
            <canvas id="guitarRhWaterfall"></canvas>
            <div class="gt-soundhole"></div>
            <div class="gt-finger-legend" id="gtRhFingerLegend" style="display:none">
              <span class="gt-fl" style="color:#00bcd4">&#x24DF; 拇指</span>
              <span class="gt-fl" style="color:#ef5350">&#x24D8; 食指</span>
              <span class="gt-fl" style="color:#ff9800">&#x24DC; 中指</span>
              <span class="gt-fl" style="color:#ffeb3b">&#x24D0; 無名指</span>
            </div>
            <div id="gtRhHint" class="gt-panel-hint">右手：刷弦節奏</div>
          </div>
        </div>
      </div>

      <!-- Ukulele Tab -->
      <div id="chordDisplayUkulele" class="chord-guitar-tab" style="display:none">
        <div class="gt-teaching-layout">
          <div class="gt-left-panel">
            <div class="gt-compact-bar">
              <span id="ukChordName" class="gt-main-chord-name">—</span>
              <div class="gt-voicing-row" id="ukVoicingRow"></div>
            </div>
            <canvas id="ukuleleVerticalFretboard"></canvas>
            <div class="gt-finger-legend">
              <span class="gt-fl" style="color:#ef5350">① 食指</span>
              <span class="gt-fl" style="color:#ff9800">② 中指</span>
              <span class="gt-fl" style="color:#ffeb3b">③ 無名指</span>
              <span class="gt-fl" style="color:#66bb6a">④ 小指</span>
            </div>
            <div id="ukLhHint" class="gt-panel-hint">左手：按住和弦</div>
          </div>
          <div class="gt-mid-line"></div>
          <div class="gt-right-panel">
            <canvas id="ukuleleRhWaterfall"></canvas>
            <div class="gt-soundhole"></div>
            <div id="ukRhHint" class="gt-panel-hint">右手：刷弦節奏</div>
          </div>
        </div>
      </div>

      <!-- Accordion Tab -->
      <div id="chordDisplayAccordion" class="chord-accordion-tab" style="display:none">
        <div class="acc-teaching-layout">
          <!-- LEFT: Bass & Chord Display (Left Hand) -->
          <div class="acc-left-panel">
            <div class="acc-chord-name-row">
              <span id="accChordName" class="acc-main-chord-name">--</span>
              <select id="accBassPatternSelect" class="acc-pattern-select" title="低音模式">
                <option value="bass_chord">Bass-Chord</option>
                <option value="alternating_bass">Alt Bass</option>
                <option value="waltz">Waltz 3/4</option>
                <option value="march">March 2/4</option>
              </select>
            </div>
            <canvas id="accordionBassGrid"></canvas>
            <div class="acc-finger-legend">
              <span class="gt-fl" style="color:#ff9800">&#9313; Chord</span>
              <span class="gt-fl" style="color:#ffeb3b">&#9314; Bass</span>
              <span class="gt-fl" style="color:#66bb6a">&#9315; Alt</span>
            </div>
            <div id="accLhHint" class="gt-panel-hint">左手：低音鈕</div>
          </div>
          <!-- MIDDLE: Line -->
          <div class="gt-mid-line"></div>
          <!-- RIGHT: Keyboard Waterfall (Right Hand) -->
          <div class="acc-right-panel">
            <canvas id="accordionKeyboardWaterfall"></canvas>
            <div id="accRhHint" class="gt-panel-hint">右手：鍵盤</div>
          </div>
        </div>
      </div>

      <!-- Arranger Keyboard Tab -->
      <div id="chordDisplayArranger" class="chord-arranger-tab" style="display:none">
        <div class="arr-unified-layout">
          <canvas id="arrangerWaterfall" class="arr-waterfall-canvas"></canvas>
          <canvas id="arrangerKeyboard" class="arr-keyboard-canvas"></canvas>
        </div>
      </div>

    </div><!-- /instrumentPanel -->
  </div><!-- /chordDisplayScaleTarget -->

  <!-- RLHF rate popup (anchored to top-bar star button) -->
  <div id="ratePopup" class="rate-popup" style="display:none">
    <button id="btnRlhfGood" class="rate-good" title="聽起來很棒">&#x1F44D; 合理</button>
    <button id="btnRlhfBad" class="rate-bad" title="有外星人指法/伴奏">&#x1F44E; 糟糕</button>
  </div>

</div><!-- /chordDisplay -->

<!-- ===== Progress Bar (between content and toolbar) ===== -->
<div id="topProgress" class="progress-bar-mid">
  <div id="topProgressFill" class="top-progress-fill" style="width:0%"></div>
  <div id="topAbRange" class="ab-range" style="display:none"></div>
</div>

<!-- ===== BOTTOM: Compact Toolbar ===== -->
<div class="bottom-toolbar">

  <!-- 1. Instrument select -->
  <div class="tb-item" id="tbInstrument">
    <button class="tb-trigger" id="btnInstrument" title="樂器選擇">&#x1F3B9;</button>
    <div class="tb-popup">
      <button class="tb-popup-btn" data-tab="piano" title="Piano 鋼琴">&#x1F3B9; 鋼琴</button>
      <button class="tb-popup-btn" data-tab="guitar" title="Guitar 吉他">&#x1F3B8; 吉他</button>
      <button class="tb-popup-btn" data-tab="ukulele" title="Ukulele 烏克麗麗">&#x1FA95; 烏克</button>
      <button class="tb-popup-btn" data-tab="accordion" title="Accordion 手風琴">&#x1FA97; 手風琴</button>
      <button class="tb-popup-btn" data-tab="arranger" title="Arranger 編曲鍵盤">&#x1F3B9; 編曲琴</button>
    </div>
  </div>

  <!-- 2. Playback -->
  <div class="tb-item tb-playback" id="tbPlayback">
    <button id="btnPrev" class="tb-trigger" title="上一首 / 回到開頭">&#x23EA;</button>
    <span id="timeCurrent" class="tb-time">0:00</span>
    <button id="btnPlay" class="tb-trigger tb-play-btn" title="播放">&#x25B6;</button>
    <span id="timeDuration" class="tb-time">0:00</span>
  </div>

  <!-- 3. Volume -->
  <div class="tb-item" id="tbVolume">
    <button id="btnMute" class="tb-trigger" title="音量">&#x1F509;</button>
    <div class="tb-popup tb-popup-volume">
      <input id="volumeSlider" type="range" min="0" max="1" step="0.05" value="1">
    </div>
  </div>

  <!-- 4. Speed -->
  <div class="tb-item">
    <button id="btnSpeed" class="tb-trigger tb-text-btn" title="播放速度">1x</button>
  </div>

  <!-- 5. Loop -->
  <div class="tb-item">
    <button id="btnLoop" class="tb-trigger" title="循環模式">&#x1F501;</button>
  </div>

  <!-- 6. A-B -->
  <div class="tb-item">
    <button id="btnABRepeat" class="tb-trigger ab-repeat-btn" title="A-B 區段循環">A-B</button>
  </div>

  <!-- 7. Transpose -->
  <div class="tb-item" id="tbTranspose">
    <button class="tb-trigger" title="移調工具">&#x2195;</button>
    <div class="tb-popup tb-popup-transpose">
      <button id="btnTransposeDown" class="tb-popup-btn">−</button>
      <span id="transposeValue" class="tb-transpose-val">0</span>
      <button id="btnTransposeUp" class="tb-popup-btn">+</button>
      <div id="capoGroup" class="tb-capo-group" style="display:none">
        <span class="tb-capo-label">Capo</span>
        <select id="capoSelect" class="tb-select">
          <option value="0">C0</option>
          <option value="1">C1</option>
          <option value="2">C2</option>
          <option value="3">C3</option>
          <option value="4">C4</option>
          <option value="5">C5</option>
          <option value="6">C6</option>
          <option value="7">C7</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 8. Jazzify -->
  <div class="tb-item">
    <button id="btnJazzify" class="tb-trigger" style="color:#ff9800" title="Jazzify L1/L2/L3">&#x1F3B7;</button>
  </div>
  <div class="tb-item">
    <button id="btnJazzifyAI" class="tb-trigger" style="color:#9c27b0; font-weight:bold; font-size:12px;" title="AI Transformer 神經網路重配和聲">✨AI</button>
  </div>

  <!-- 9. AI Teaching -->
  <div class="tb-item" id="tbTeaching">
    <button class="tb-trigger" title="AI 伴奏教學">&#x1F916;</button>
    <div class="tb-popup tb-popup-wide">
      <button id="btnTeachAI" class="tb-popup-btn" title="AI 推薦風格">AI</button>
      <select id="guitarStyleSelect" class="tb-select" title="吉他右手風格" style="display:none">
        <option value="arpeggio" selected>Arpeggio</option>
        <option value="pattern">Rhythm</option>
        <option value="block">Block</option>
      </select>
      <select id="teachStyle" class="tb-select" title="伴奏風格">
        <option value="Auto" selected>Auto</option>
        <option value="Block">Block</option>
        <option value="Arpeggio">Flow</option>
        <option value="Rhythm">Ballad</option>
        <option value="Walking">Walking</option>
        <option value="Stride">Stride</option>
      </select>
      <button id="btnTopHandSwitch" class="tb-popup-btn hand-toggle-btn" title="切換教學手勢">
        <img src="/img/left-hand.png" class="hand-icon hand-left active" alt="L">
        <img src="/img/right-hand.png" class="hand-icon hand-right active" alt="R">
      </button>
      <button id="btnShowChordTonesTB" class="tb-popup-btn" style="color:#9c27b0" title="顯示和弦組成音">&#x1F3B5;</button>
      <button id="btnFingering" class="tb-popup-btn" style="color:#4caf50" title="鋼琴鍵指法">&#x270B;</button>
      <button id="btnRefreshAcc" class="tb-popup-btn" style="color:#4caf50" title="強制重新生成伴奏">&#x1F504;</button>
      <button id="btnDownloadMidi" class="tb-popup-btn" style="color:#2196f3" title="下載 MIDI">&#x1F4BE;</button>
      <div class="tb-separator"></div>
      <button id="btnAudioMode" class="tb-popup-btn" style="color:#03a9f4" title="切換音軌">&#x1F3B5; Music</button>
      <div id="crossfaderContainer" style="display:none; align-items:center; gap:4px;">
        <span style="font-size:10px; color:#aaa;">Music</span>
        <input id="crossfaderVol" type="range" min="0" max="1" step="0.05" value="0.5" style="width:60px;">
        <span style="font-size:10px; color:#ff9800;">MIDI</span>
      </div>
    </div>
  </div>

  <!-- 10. Tools -->
  <div class="tb-item" id="tbTools">
    <button class="tb-trigger" title="工具">&#x1F527;</button>
    <div class="tb-popup">
      <button id="btnDetect" class="tb-popup-btn" title="偵測和弦">&#x1F50D; 偵測</button>
      <a id="btnEdit" class="tb-popup-btn" style="text-decoration:none" title="編輯和弦譜">&#x270F; 編輯</a>
      <button id="btnAiSuggest" class="tb-popup-btn" style="color:#4caf50" title="AI 建議下一個和弦">&#x1F4A1; AI建議</button>
    </div>
  </div>

</div><!-- /bottom-toolbar -->

<div id="toast" class="toast"></div>
<audio id="audio" preload="metadata"></audio>

<script src="/js/utils.js?v=2"></script>
<script src="/js/api.js?v=55"></script>
<script src="/js/chord-render.js?v=53"></script>
<script src="/js/arpeggio-patterns.js?v=1"></script>
<script src="/js/string-instrument.js?v=1"></script>
<script src="/js/instrument-registry.js?v=1"></script>
<script src="/js/accordion-instrument.js?v=1"></script>
<script src="/js/arranger-instrument.js?v=2"></script>
<script src="/js/midi-exporter.js?v=1"></script>
<script>
  const originalFetch = window.fetch;
  window.fetch = function() {
    let [resource, config] = arguments;
    if(config == null) config = {};
    const url = typeof resource === 'string' ? resource : (resource instanceof Request ? resource.url : '');
    if (url.startsWith('/') || url.includes(window.location.host)) {
        if(config.headers == null) config.headers = {};
        const token = localStorage.getItem("livechord_token");
        if(token) config.headers['Authorization'] = `Bearer ${token}`;
    }
    return originalFetch(resource, config);
  };
</script>
<script src="/js/player.js?v=71"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=3.0, user-scalable=yes">
  <title>LiveChord — 播放</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#e94560">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/css/base.css?v=1">
  <link rel="stylesheet" href="/css/player.css?v=2">
</head>
<body>

<!-- header (hidden in immersive, shown on hover) -->
<header class="header" style="position:relative">
  <a href="/" style="text-decoration:none"><h1>LiveChord</h1></a>
  <div class="search-box">
    <input id="searchInput" type="text" placeholder="搜尋歌曲、演出者、專輯…" autocomplete="off">
    <div id="searchResults" class="search-results"></div>
  </div>
  <nav></nav>
  <button id="btnPageFs" class="header-fs-btn" title="全螢幕">&#x26F6;</button>
</header>

<div class="player-page">

  <!-- song info (compact in immersive mode) -->
  <div class="player-header" id="playerHeader">
    <img id="cover" class="player-cover" src="" alt="" onerror="this.style.display='none'">
    <div class="player-info">
      <div id="songTitle" class="song-title">—</div>
      <div id="songArtist" class="song-artist"></div>
      <div id="songAlbum" class="song-album"></div>
      <div id="songMeta" class="song-meta"></div>
    </div>
  </div>

  <!-- audio controls (compact) -->
  <div class="audio-controls">
    <div class="controls-row">
      <button id="btnRewind" title="回到開頭">&#x23EE;</button>
      <button id="btnPrev" title="上一首">&#x23EA;</button>
      <button id="btnPlay" class="btn-play" title="播放">&#x25B6;</button>
      <button id="btnNext" title="下一首">&#x23E9;</button>
      <span id="timeCurrent" class="time-label">0:00</span>
      <div class="progress-bar" id="progressBar" style="flex:1">
        <div class="ab-range" id="abRange" style="display:none"></div>
        <div class="progress" id="progress" style="width:0%"></div>
      </div>
      <span id="timeDuration" class="time-label">0:00</span>
      <button id="btnFav" class="btn-fav" title="收藏">&#x2661;</button>
      <button id="btnLoop" class="speed-btn" title="循環模式">&#x1F501;</button>
      <button id="btnSpeed" class="speed-btn" title="播放速度">1x</button>
      <div class="volume-control">
        <span id="btnMute" style="cursor:pointer">&#x1F509;</span>
        <input id="volumeSlider" type="range" min="0" max="1" step="0.05" value="1">
      </div>
    </div>
  </div>

  <!-- 偵測中覆蓋層 -->
  <div id="detectOverlay" class="detect-overlay" style="display:none">
    <div class="detect-box">
      <div id="loadingSpinner" class="spinner" style="margin-bottom:12px; margin-left:auto; margin-right:auto;"></div>
      <div id="musicBarsAnim" class="music-bars" style="display:none; margin-bottom:16px;">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>
      <div id="detectMsg" style="font-size:15px;margin-bottom:8px;font-weight:bold;">正在偵測和弦…</div>
      <div id="detectDetail" style="font-size:12px;color:var(--text-dim)">首次播放需要分析音訊，請稍候</div>
    </div>
  </div>

  <!-- chord display -->
  <div class="chord-section" id="chordSection">
    <!-- 當前和弦大字顯示 -->
    <div id="currentChordBig" class="current-chord-big" style="display:none">
      <div id="bigChordName" class="big-chord-name">—</div>
      <div id="bigChordJianpu" class="big-chord-jianpu"></div>
      <div id="bigChordDiagram"></div>
    </div>

    <!-- 主顯示區 (預設沉浸式) -->
    <div id="chordDisplay" class="chord-display-area immersive">
      <!-- 底部工具列 (tab切換 + 共用控制) -->
      <div class="chord-toolbar">
        <div style="display:flex;align-items:center;gap:8px">
          <span id="chordSource" class="chord-source-badge"></span>
          <span id="chordKey" style="font-size:14px;font-weight:700;color:var(--text)"></span>

          <!-- 三個主 Tab: Overview | Piano | Guitar -->
          <div class="chord-view-tabs" style="display:flex; gap:2px; margin-left:8px; background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:2px;">
            <button id="tabOverview" class="view-tab active" style="border:none;" title="Overview 全覽">&#x25A6;</button>
            <button id="tabPiano" class="view-tab" style="border:none;" title="Piano 鋼琴">&#x2328;</button>
            <button id="tabGuitar" class="view-tab" style="border:none;" title="Guitar 吉他">&#x1F3B8;</button>
          </div>

          <button id="btnDetect" class="toolbar-btn tb-icon" title="偵測和弦">&#x1F50D;</button>
          <a id="btnEdit" class="toolbar-btn tb-icon" style="text-decoration:none" title="編輯和弦譜">&#x270F;</a>
          <button id="btnAiSuggest" class="toolbar-btn tb-icon" style="color:#4caf50" title="AI 建議下一個和弦">&#x1F4A1;</button>
          <button id="btnJazzify" class="toolbar-btn tb-icon" style="color:#ff9800" title="Jazzify L1/L2/L3">&#x1F3B7;</button>
          <button id="btnShowChordTonesTB" class="toolbar-btn tb-icon" style="color:#9c27b0; transition: all 0.2s;" title="顯示鍵盤和弦組成音">&#x1F3B5;</button>

          <!-- 左右手開關 (統合) -->
          <button id="btnTopHandSwitch" class="toolbar-btn hand-toggle-btn" style="margin-left:8px;" title="切換教學手勢 (雙手)">
            <img src="/img/left-hand.png" class="hand-icon hand-left active" alt="L">
            <img src="/img/right-hand.png" class="hand-icon hand-right active" alt="R">
          </button>
        </div>

        <div style="display:flex;align-items:center;gap:6px">
          <!-- A-B 循環 (所有 tab 共用) -->
          <button id="btnABRepeat" class="toolbar-btn ab-repeat-btn" title="A-B 區段循環">A-B</button>

          <!-- 移調 -->
          <span style="font-size:13px;color:var(--text-dim)" title="移調">&#x2195;</span>
          <button id="btnTransposeDown" class="toolbar-btn">-</button>
          <span id="transposeValue" style="font-size:12px;min-width:16px;text-align:center;color:var(--text-dim)">0</span>
          <button id="btnTransposeUp" class="toolbar-btn">+</button>

          <!-- Capo (吉他/烏克麗麗時顯示) -->
          <div id="capoGroup" class="toolbar-group" style="display:none">
            <select id="capoSelect" class="toolbar-select" title="Capo">
              <option value="0">C0</option>
              <option value="1">C1</option>
              <option value="2">C2</option>
              <option value="3">C3</option>
              <option value="4">C4</option>
              <option value="5">C5</option>
              <option value="6">C6</option>
              <option value="7">C7</option>
            </select>
          </div>

          <!-- 樂器切換 (單按鈕 + dropdown) -->
          <div id="instrumentDropdown" class="instrument-dropdown">
            <button id="btnInstrument" class="toolbar-btn" title="切換樂器" style="font-size:18px;">&#x1F3B9;</button>
            <div id="instrumentMenu" class="instrument-menu" style="display:none">
              <button class="inst-option active" data-mode="piano">&#x1F3B9; 鋼琴</button>
              <button class="inst-option" data-mode="guitar">&#x1F3B8; 吉他</button>
              <button class="inst-option" data-mode="ukulele">&#x1FA95; 烏克麗麗</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 頂部覆蓋工具列 (迷你播放控制 + 曲名 + 縮放) -->
      <div class="chord-display-tools chord-overlay-tools" style="left: 4px; right: 4px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; height: auto; pointer-events: none;">
        <div style="display: flex; gap: 16px; align-items: center; background: rgba(15,15,15,0.3); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-radius: 10px; padding: 4px 12px; pointer-events: auto; justify-self: start; max-width: 100%; overflow: hidden;">
          <div style="display: flex; gap: 2px; flex-shrink: 0;">
            <button class="cd-tool-btn" id="btnMiniRewind" title="回到開頭">&#x23EE;</button>
            <button class="cd-tool-btn" id="btnMiniPrev" title="上一首">&#x23EA;</button>
            <button class="cd-tool-btn" id="btnMiniPlay" title="播放/暫停">&#x25B6;</button>
            <button class="cd-tool-btn" id="btnMiniNext" title="下一首">&#x23E9;</button>
            <button class="cd-tool-btn" id="btnMiniSpeed" title="播放速度">1x</button>
          </div>
          <div style="display:flex; align-items:center; gap:4px; flex-shrink:0;">
            <span id="btnMiniMute" class="cd-tool-btn" style="cursor:pointer; font-size:14px;">&#x1F509;</span>
            <input id="miniVolumeSlider" type="range" min="0" max="1" step="0.05" value="1" style="width:60px; accent-color:var(--accent);">
          </div>
          <div class="fs-progress-container" style="display: flex; align-items: center; width: 160px; min-width: 100px; gap: 8px; flex-shrink: 1;">
            <span id="fsTimeCurrent" class="time-label" style="min-width: 32px; text-align: right; flex-shrink: 0;">0:00</span>
            <div class="progress-bar" id="fsProgressBar" style="flex:1; min-width: 0;">
              <div class="ab-range" id="fsAbRange" style="display:none"></div>
              <div class="progress" id="fsProgress" style="width:0%"></div>
            </div>
            <span id="fsTimeDuration" class="time-label" style="min-width: 32px; text-align: left; flex-shrink: 0;">0:00</span>
          </div>
        </div>
        <div style="display: flex; justify-content: center; min-width: 0; padding-top: 2px;">
          <div style="display: inline-flex; align-items: center; background: rgba(15,15,15,0.3); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-radius: 10px; padding: 5px 16px; pointer-events: auto; max-width: 100%; overflow: hidden;">
            <span class="mini-title-wrap" style="height: auto; overflow: hidden;"><span class="mini-title" id="miniTitle"></span></span>
          </div>
        </div>
        <div style="display: flex; gap: 2px; align-items: center; justify-self: end; pointer-events: auto; margin-right: 32px;">
          <button class="cd-tool-btn" id="btnZoomOut" title="縮小">−</button>
          <button class="cd-tool-btn" id="btnZoomReset" title="重設">100%</button>
          <button class="cd-tool-btn" id="btnZoomIn" title="放大">+</button>
        </div>
      </div>

      <div id="chordDisplayScaleTarget" style="flex:1; display:flex; flex-direction:column; transform-origin:top left; min-height:0; width:100%; overflow:hidden;">

        <!-- Overview Tab -->
        <div id="chordDisplayOverview" class="chord-timeline"></div>

        <!-- Piano Tab (合併原 Diagrams + 88-Keys) -->
        <div id="chordDisplayPiano" class="chord-piano-tab" style="display:none">
          <!-- 子模式切換: 靜態 vs 瀑布 -->
          <div class="piano-submode-bar">
            <button id="btnSubStatic" class="sub-tab" data-submode="static">靜態</button>
            <button id="btnSubWaterfall" class="sub-tab active" data-submode="waterfall">瀑布</button>
          </div>
          <!-- 靜態 ribbon (原 Diagrams) -->
          <div id="pianoStaticView" class="chord-ribbon" style="display:none">
            <div class="ribbon-center-line"></div>
            <div class="ribbon-track" id="ribbonTrack"></div>
          </div>
          <!-- 瀑布流 (原 88-Keys) -->
          <div id="pianoWaterfallView" class="chord-88-keys">
            <div id="keys88Ribbon" class="keys88-ribbon">
              <div class="ribbon-center-line"></div>
              <div class="ribbon-track" id="keys88RibbonTrack"></div>
            </div>
            <canvas id="waterfallCanvas" class="waterfall-canvas"></canvas>
            <canvas id="piano88Canvas"></canvas>
          </div>
          <!-- 教學控制 (僅 Piano tab) -->
          <div id="teachControls" class="teach-controls">
            <button id="btnTeachAI" class="toolbar-btn" title="AI 推薦風格">AI</button>
            <select id="teachStyle" class="toolbar-select" title="伴奏風格">
              <option value="Auto" selected>Auto (段落自適)</option>
              <option value="Block">Block (柱狀和弦)</option>
              <option value="Arpeggio">Flow (分解伴奏)</option>
              <option value="Rhythm">Ballad (附點節奏)</option>
              <option value="Walking">Pro (Jazz Walking)</option>
              <option value="Stride">Pro (Stride)</option>
            </select>
            <div id="levelSwitch" class="teach-level-group">
              <button class="mode-btn active" data-level="L1">基礎</button>
              <button class="mode-btn" data-level="L2">進階</button>
              <button class="mode-btn" data-level="L3">大師</button>
            </div>
            <div id="handSwitchContainer" style="display:flex; align-items:center; margin-left:4px; margin-right:8px;">
              <button id="btnBottomHandSwitch" class="toolbar-btn hand-toggle-btn" title="切換教學手勢 (雙手)">
                <img src="/img/left-hand.png" class="hand-icon hand-left active" alt="L">
                <img src="/img/right-hand.png" class="hand-icon hand-right active" alt="R">
              </button>
            </div>
            <button id="btnBottomShowChordTones" class="toolbar-btn tb-icon" style="color:#9c27b0; transition: all 0.2s;" title="顯示鍵盤和弦組成音">&#x1F3B5;</button>
            <button id="btnFingering" class="toolbar-btn tb-icon" style="color:#4caf50; transition: all 0.2s;" title="鋼琴鍵指法顯示">&#x270B;</button>
            <button id="btnRefreshAcc" class="toolbar-btn tb-icon" style="color:#4caf50; transition: all 0.2s;" title="強制重新生成伴奏 (清除快取)">&#x1F504;</button>

            <!-- RLHF Rating Button & Popup -->
            <div style="position:relative; display:flex; align-items:center;">
              <button id="btnRateAi" class="toolbar-btn tb-icon" style="color:#ff5722; transition: all 0.2s; font-size:16px;" title="AI 伴奏評分">&#x2B50;</button>
              <div id="ratePopup" style="display:none; position:absolute; bottom:40px; left:50%; transform:translateX(-50%); background:rgba(30,30,30,0.9); backdrop-filter:blur(8px); border:1px solid #555; border-radius:8px; padding:8px; z-index:100; white-space:nowrap; box-shadow:0 8px 16px rgba(0,0,0,0.5);">
                <button id="btnRlhfGood" title="聽起來很棒" style="background:#2e7d32; color:#fff; border:none; border-radius:6px; padding:6px 12px; cursor:pointer; font-size:12px; margin-right:4px;">&#x1F44D; 合理</button>
                <button id="btnRlhfBad" title="有外星人指法/伴奏" style="background:#c62828; color:#fff; border:none; border-radius:6px; padding:6px 12px; cursor:pointer; font-size:12px;">&#x1F44E; 糟糕</button>
              </div>
            </div>

            <button id="btnAudioMode" class="toolbar-btn" style="font-weight:bold; color:#03a9f4; border: 1px solid #03a9f4; border-radius: 4px; padding: 0 8px; font-size: 13px; margin: 0 4px; min-width: 68px; transition: all 0.2s;" title="切換音軌: Music -> MIDI -> Mix">🎵 Music</button>

            <!-- Crossfader container (only visible in Mix mode) -->
            <div id="crossfaderContainer" style="display:none; align-items:center; background:rgba(0,0,0,0.3); border-radius:12px; padding:0 8px; margin:0 4px; height: 28px;">
              <span style="font-size:11px; color:#aaa; margin-right:6px;">Music</span>
              <input id="crossfaderVol" type="range" min="0" max="1" step="0.05" value="0.5" style="width:80px; margin:0;">
              <span style="font-size:11px; color:#ff9800; margin-left:6px;">MIDI</span>
            </div>

            <button id="btnDownloadMidi" class="toolbar-btn tb-icon" style="color:#2196f3; transition: all 0.2s;" title="下載 AI 伴奏 MIDI">&#x1F4BE;</button>
          </div>
        </div>

        <!-- Guitar Tab (新增) -->
        <div id="chordDisplayGuitar" class="chord-guitar-tab" style="display:none">
          <div class="guitar-layout">
            <!-- 左欄: 和弦時間軸 -->
            <div class="guitar-panel-left" id="guitarTimeline"></div>
            <!-- 中欄: 指板主區 -->
            <div class="guitar-panel-center" id="guitarFretboard">
              <div class="gt-chord-header">
                <div id="gtChordName" class="gt-main-chord-name">—</div>
                <div id="gtChordIntervals" class="gt-chord-intervals"></div>
              </div>
              <canvas id="guitarFretboardCanvas"></canvas>
              <div class="gt-chord-detail">
                <div class="gt-detail-item">
                  <span class="gt-detail-label">Fingering</span>
                  <span id="gtFingering" class="gt-detail-value">—</span>
                </div>
                <div class="gt-detail-item">
                  <span class="gt-detail-label">Notes</span>
                  <span id="gtNotes" class="gt-detail-value">—</span>
                </div>
                <div class="gt-detail-item">
                  <span class="gt-detail-label">Type</span>
                  <span id="gtType" class="gt-detail-value">—</span>
                </div>
              </div>
              <div class="gt-voicing-row" id="gtVoicingRow">
                <span class="gt-voicing-label">Voicing variants</span>
              </div>
            </div>
            <!-- 右欄: 教學資訊 -->
            <div class="guitar-panel-right" id="guitarTeachInfo">
              <div class="gt-section" id="gtFingeringGuide">
                <h4 class="gt-section-title">FINGERING GUIDE</h4>
                <div id="gtFingeringList" class="gt-fingering-list"></div>
              </div>
              <div class="gt-section" id="gtNextChord">
                <h4 class="gt-section-title">NEXT CHORD</h4>
                <div id="gtNextChordContent" class="gt-next-chord-content"></div>
              </div>
              <div class="gt-section" id="gtChordInKey">
                <h4 class="gt-section-title">CHORD IN KEY</h4>
                <div id="gtChordInKeyContent" class="gt-chord-in-key-content"></div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

</div>

<div id="toast" class="toast"></div>
<audio id="audio" preload="metadata"></audio>

<script src="/js/utils.js?v=1"></script>
<script src="/js/api.js?v=53"></script>
<script src="/js/chord-render.js?v=53"></script>
<script src="/js/midi-exporter.js?v=1"></script>
<script src="/js/player.js?v=60"></script>
</body>
</html>

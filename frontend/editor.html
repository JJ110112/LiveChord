<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveChord — 和弦編輯</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css?v=2">
  <link rel="stylesheet" href="/css/player.css?v=2">
  <script>
    if (!localStorage.getItem("livechord_token")) {
      fetch('/api/auth/is_admin').then(r => {
        if (!r.ok) window.location.href = "/login";
      }).catch(() => {
        window.location.href = "/login";
      });
    }
  </script>
  <style>
    .editor-page { max-width: 1100px; margin: 0 auto; padding: 20px 24px; }

    /* 時間軸 */
    .timeline-container {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
      overflow-x: auto;
    }
    .timeline {
      position: relative;
      height: 120px;
      min-width: 100%;
      background: #111;
      border-radius: 4px;
      cursor: crosshair;
    }
    .timeline .ruler {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 20px;
      border-bottom: 1px solid #333;
      cursor: pointer;
    }
    .timeline .ruler .tick {
      position: absolute;
      top: 0;
      font-size: 9px;
      color: #666;
      border-left: 1px solid #444;
      height: 20px;
      padding-left: 3px;
    }
    .timeline .playhead {
      position: absolute;
      top: 0; bottom: 0;
      width: 2px;
      background: var(--accent);
      z-index: 10;
      pointer-events: none;
    }
    .timeline .chord-block {
      position: absolute;
      top: 24px;
      height: 60px;
      background: rgba(233, 69, 96, 0.3);
      border: 1px solid var(--accent);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      min-width: 5px;
      overflow: hidden;
    }
    .chord-block:hover { background: rgba(233, 69, 96, 0.5); }
    .chord-block.selected {
      background: rgba(233, 69, 96, 0.6);
      border-width: 2px;
      z-index: 5;
    }
    .chord-block .resize-handle {
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 6px;
      cursor: ew-resize;
      background: transparent;
    }
    .chord-block .resize-handle:hover { background: rgba(255,255,255,.2); }

    /* 和弦面板 */
    .chord-palette {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 12px;
      background: var(--bg-card);
      border-radius: var(--radius);
      margin-bottom: 16px;
    }
    .chord-palette .palette-btn {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      transition: all .15s;
    }
    .chord-palette .palette-btn:hover { background: var(--bg-hover); }
    .chord-palette .palette-btn.selected {
      background: var(--accent);
      border-color: var(--accent);
    }

    /* kbd shortcut badges */
    .edit-toolbar kbd {
      display: inline-block;
      padding: 0 4px;
      margin-left: 4px;
      font-size: 10px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 3px;
      color: var(--text-dim);
      font-family: monospace;
      vertical-align: middle;
    }

    /* help overlay */
    .help-overlay {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(22,27,34,0.97);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px 32px;
      z-index: 300;
      min-width: 320px;
      box-shadow: 0 12px 40px rgba(0,0,0,.6);
    }
    .help-overlay h3 { margin: 0 0 12px 0; font-size: 16px; }
    .help-overlay table { width: 100%; border-collapse: collapse; }
    .help-overlay td { padding: 4px 0; font-size: 13px; }
    .help-overlay td:first-child { width: 100px; color: var(--text-dim); font-family: monospace; }
    .help-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 299;
    }

    /* 編輯工具列 */
    .edit-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--bg-card);
      border-radius: var(--radius);
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .edit-toolbar label { font-size: 12px; color: var(--text-dim); }
    .edit-toolbar input, .edit-toolbar select {
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    .edit-toolbar .sep {
      width: 1px; height: 24px; background: var(--border); margin: 0 4px;
    }
  </style>
</head>
<body>

<header class="header">
  <a href="/" style="text-decoration:none"><h1>LiveChord</h1></a>
  <span id="editorTitle" style="color:var(--text-dim);font-size:14px;margin-left:12px"></span>
  <div style="margin-left:auto;display:flex;gap:8px">
    <button id="btnSave" class="toolbar-btn" style="width:auto;padding:4px 14px;font-size:13px">儲存</button>
    <a id="btnBack" href="/player" class="toolbar-btn" style="width:auto;padding:4px 14px;font-size:13px;text-decoration:none;display:flex;align-items:center">返回播放</a>
  </div>
</header>

<div class="editor-page">

  <!-- 播放控制 -->
  <div class="audio-controls" style="margin-bottom:16px">
    <div class="progress-bar" id="progressBar">
      <div class="progress" id="progress" style="width:0%"></div>
    </div>
    <div class="time-row">
      <span id="timeCurrent">0:00</span>
      <span id="timeDuration">0:00</span>
    </div>
    <div class="controls-row">
      <button onclick="document.getElementById('audio').currentTime -= 5" class="btn-play" style="font-size:14px; padding: 4px 8px;" title="倒轉 5 秒">⏪</button>
      <button id="btnPlay" class="btn-play" title="播放/暫停">&#x25B6;</button>
      <button onclick="document.getElementById('audio').currentTime += 5" class="btn-play" style="font-size:14px; padding: 4px 8px;" title="快進 5 秒">⏩</button>
      <div class="volume-control" style="margin-left: 12px;">
        <span>&#x1F509;</span>
        <input id="volumeSlider" type="range" min="0" max="1" step="0.05" value="1">
      </div>
    </div>
  </div>

  <!-- 工具列 -->
  <div class="edit-toolbar">
    <label>Key:</label>
    <input id="keyInput" type="text" value="" style="width:50px" placeholder="C">
    <div class="sep"></div>
    <label>選中和弦:</label>
    <input id="chordNameInput" type="text" style="width:80px" placeholder="Am">
    <button id="btnUpdate" class="toolbar-btn" style="width:auto;padding:2px 10px;font-size:12px" title="更新選中和弦的名稱">更新</button>
    <button id="btnDelete" class="toolbar-btn" style="width:auto;padding:2px 10px;font-size:12px;color:#f66">刪除 <kbd>Del</kbd></button>
    <button id="btnReplaceAll" class="toolbar-btn" style="width:auto;padding:2px 10px;font-size:12px;color:#ff9800" title="全曲取代：將某和弦名稱全部換成另一個 (Ctrl+H)">🔄 全取代 <kbd>Ctrl+H</kbd></button>
    <div class="sep"></div>
    <label>縮放:</label>
    <input id="zoomSlider" type="range" min="5" max="150" value="15" style="width:100px">
    <div class="sep"></div>
    <button id="btnNudgeLeft" class="toolbar-btn" style="width:auto;padding:2px 6px;font-size:12px" title="向左偏移 0.25s">◀ 移</button>
    <button id="btnNudgeRight" class="toolbar-btn" style="width:auto;padding:2px 6px;font-size:12px" title="向右偏移 0.25s">移 ▶</button>
    <div class="sep"></div>
    <button id="btnSplit" class="toolbar-btn" style="width:auto;padding:2px 10px;font-size:12px;color:#4caf50" title="分割選中的和弦為兩段 (S)">✂ 分割 <kbd>S</kbd></button>
    <button id="btnQuantize" class="toolbar-btn" style="width:auto;padding:2px 10px;font-size:12px;color:#2196F3" title="將所選連續和弦的長度修整至最佳拍數 (消除零碎拍子)">🌟 正規化</button>
    <div class="sep"></div>
    <label style="display:flex; align-items:center; cursor:pointer;" id="lblSnap"><input type="checkbox" id="chkSnap" checked style="margin-right:4px">貼齊 (BPM)</label>
    <div class="sep"></div>
    <button id="btnTapTempo" class="toolbar-btn" style="width:auto;padding:2px 10px;font-size:12px;color:#ff5722" title="打拍子修正 BPM (T)">🥁 打拍 <kbd>T</kbd></button>
    <span id="tapBpmDisplay" style="font-size:12px;color:var(--text-dim);min-width:50px"></span>
    <button id="btnApplyTapBpm" class="toolbar-btn" style="display:none;width:auto;padding:2px 10px;font-size:12px;color:#4caf50">套用 BPM</button>
    <button id="btnResetTap" class="toolbar-btn" style="display:none;width:auto;padding:2px 6px;font-size:11px;color:#999">重置</button>
    <div class="sep"></div>
    <button id="btnRecordMode" class="toolbar-btn" style="width:auto;padding:2px 10px;font-size:12px;color:#e91e63" title="即時輸入模式：播放時打字或 MIDI 輸入和弦 (R)">🎤 即時輸入 <kbd>R</kbd></button>
    <span id="recordModeIndicator" style="display:none;font-size:12px;color:#e91e63;font-weight:bold;">● REC</span>
    <button id="btnMIDI" class="toolbar-btn" style="width:auto;padding:2px 10px;font-size:12px" title="連接 MIDI 控制器">🎹 MIDI</button>
    <div class="sep"></div>
    <button id="btnImport" class="toolbar-btn" style="width:auto;padding:2px 10px;font-size:12px">匯入 ChordPro</button>
  </div>

  <!-- 時間軸 -->
  <div class="timeline-container">
    <div id="timeline" class="timeline">
      <div id="ruler" class="ruler"></div>
      <div id="playhead" class="playhead" style="left:0"></div>
    </div>
  </div>

  <!-- 和弦面板 -->
  <div>
    <div style="font-size:13px;color:var(--text-dim);margin-bottom:6px">點擊時間軸空白處新增和弦，或從面板選取後點擊：</div>
    <div id="chordPalette" class="chord-palette"></div>
  </div>

</div>

<div id="helpBackdrop" class="help-backdrop"></div>
<div id="helpOverlay" class="help-overlay">
  <h3>快捷鍵一覽 <span style="font-size:12px;color:var(--text-dim);font-weight:normal">按 ? 或 Esc 關閉</span></h3>
  <table>
    <tr><td>Space</td><td>播放 / 暫停</td></tr>
    <tr><td>← →</td><td>快退 / 快進 5 秒</td></tr>
    <tr><td>Del</td><td>刪除選中和弦</td></tr>
    <tr><td>Ctrl+C / V</td><td>複製 / 貼上和弦</td></tr>
    <tr><td>Ctrl+H</td><td>全曲取代和弦</td></tr>
    <tr><td>S</td><td>分割選中和弦</td></tr>
    <tr><td>T</td><td>打拍子 (修正 BPM)</td></tr>
    <tr><td>R</td><td>即時輸入模式</td></tr>
    <tr><td>Esc</td><td>取消選取 / 關閉</td></tr>
    <tr><td>Alt+拖曳</td><td>複製和弦</td></tr>
    <tr><td>Shift+點擊</td><td>範圍選取</td></tr>
    <tr><td>?</td><td>顯示此說明</td></tr>
  </table>
</div>
<div id="liveChordInput" style="display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(22,27,34,0.95);border:2px solid #e91e63;border-radius:12px;padding:12px 20px;z-index:200;text-align:center;">
  <div style="font-size:11px;color:var(--text-dim);margin-bottom:4px">輸入和弦後按 Enter 放置 (Esc 結束)</div>
  <input id="liveChordText" type="text" placeholder="C, Am, F7..." style="width:200px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:18px;text-align:center;font-weight:bold;">
</div>
<div id="splitPopup" style="display:none;position:fixed;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:12px;z-index:200;min-width:200px;box-shadow:0 8px 24px rgba(0,0,0,.4);">
  <div style="font-size:13px;margin-bottom:8px;color:var(--text-dim)">分割比例 (拍數):</div>
  <div id="splitOptions" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
  <div style="margin-top:10px;display:flex;gap:6px;align-items:center;border-top:1px solid var(--border);padding-top:8px;">
    <label style="font-size:12px;color:var(--text-dim)">自訂:</label>
    <input id="splitCustomLeft" type="number" min="0.5" step="0.5" style="width:50px;padding:2px 4px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:12px;">
    <span style="color:var(--text-dim);font-size:12px">/</span>
    <input id="splitCustomRight" type="number" min="0.5" step="0.5" style="width:50px;padding:2px 4px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:12px;">
    <button id="splitCustomBtn" class="toolbar-btn" style="width:auto;padding:2px 8px;font-size:11px">套用</button>
  </div>
</div>
<div id="toast" class="toast"></div>
<audio id="audio" preload="auto"></audio>

<script src="/js/utils.js?v=2"></script>
<script>
  const originalFetch = window.fetch;
  window.fetch = function() {
    let [resource, config] = arguments;
    if(config == null) config = {};
    const url = typeof resource === 'string' ? resource : (resource instanceof Request ? resource.url : '');
    if (url.startsWith('/') || url.includes(window.location.host)) {
        if(config.headers == null) config.headers = {};
        const token = localStorage.getItem("livechord_token");
        if(token) config.headers['Authorization'] = `Bearer ${token}`;
    }
    return originalFetch(resource, config);
  };
</script>
<script src="/js/api.js"></script>
<script src="/js/editor.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="share.title_tag">Receiving share — LiveChord</title>
<script src="/js/i18n.js?v=17"></script>
<style>
  html, body { margin:0; padding:0; background:#0f0f0f; color:#eee;
    font-family: "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif; }
  .wrap { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; }
  .spinner { width:36px; height:36px; border:3px solid #333; border-top-color:#4fc3f7; border-radius:50%; animation:spin .8s linear infinite; margin-bottom:16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { font-size:15px; color:#bbb; max-width:320px; line-height:1.5; }
  a { color:#4fc3f7; }
</style>
</head>
<body>
<div class="wrap">
  <div class="spinner"></div>
  <div id="msg" class="msg" data-i18n="share.msg.loading">Receiving the shared link…</div>
</div>
<script>
function _trShare(key, fb) {
  if (window.LiveChordI18n) return window.LiveChordI18n.t(key);
  return fb || key;
}
(function () {
  const YT_RE = /(?:v=|youtu\.be\/|\/shorts\/|\/embed\/)([A-Za-z0-9_-]{11})/;
  const params = new URLSearchParams(window.location.search);
  const candidates = [params.get("url"), params.get("text"), params.get("title")].filter(Boolean);
  let videoId = null;
  let sourceUrl = "";
  for (const c of candidates) {
    const m = c.match(YT_RE);
    if (m) { videoId = m[1]; sourceUrl = c; break; }
  }
  if (videoId) {
    const ytUrl = "https://youtu.be/" + videoId;
    window.location.replace("/?youtube=" + encodeURIComponent(ytUrl));
  } else {
    const msg = document.getElementById("msg");
    // i18n.js may not have loaded the dict yet; render fallback first then
    // re-render once the dict is ready so users get translated text.
    const apply = () => {
      msg.innerHTML = _trShare(
        "share.msg.no_yt_html",
        'Could not detect a YouTube link in the shared content.<br><a href="/">Back to home</a>'
      );
    };
    apply();
    document.addEventListener("livechord:i18nready", apply);
    document.addEventListener("livechord:langchange", apply);
  }
})();
</script>
</body>
</html>

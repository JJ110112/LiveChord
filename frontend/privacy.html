<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="privacy.title_tag">LiveChord — Privacy</title>
  <meta name="description" content="LiveChord privacy notice.">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://livechord.org/privacy">
  <link rel="icon" href="/favicon.svg?v=4" type="image/svg+xml">
  <script>(function(){try{var t=localStorage.getItem('livechord_theme');if(/^(light|forest|sakura|sunny|sky)$/.test(t))document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <script src="/js/auth.js?v=4"></script>
  <script src="/js/i18n.js?v=28"></script>
  <link rel="stylesheet" href="/css/base.css?v=5">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: var(--bg);
      margin: 0;
      color: var(--text);
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
    }
    .doc-container {
      background: var(--bg-card);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem;
      width: 100%;
      max-width: 560px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }
    .doc-container::before {
      content: '';
      position: absolute;
      top: -50px; left: -50px;
      width: 100px; height: 100px;
      background: var(--accent);
      filter: blur(60px);
      border-radius: 50%;
      opacity: 0.35;
    }
    h1 { text-align: center; font-size: 1.5rem; margin-bottom: 1.5rem; color: var(--accent); }
    .doc-content {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      max-height: 400px;
      overflow-y: auto;
      margin-bottom: 1.5rem;
      line-height: 1.7;
      font-size: 0.9rem;
      color: var(--text-dim);
    }
    .doc-content h3 { color: var(--accent); margin: 1rem 0 0.5rem; font-size: 1rem; }
    .doc-content h3:first-child { margin-top: 0; }
    .doc-content p { color: var(--text); }
    .doc-content ul { padding-left: 1.2rem; margin: 0.5rem 0; }
    .doc-content li { margin-bottom: 0.3rem; color: var(--text-dim); }
    .doc-content strong { color: var(--text); }
    .back-link {
      display: block; text-align: center; margin-top: 1rem;
      color: var(--text-dim); text-decoration: none; font-size: 0.85rem;
    }
    .back-link:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="doc-container">
    <h1 data-i18n="privacy.title">LiveChord Privacy</h1>
    <div class="doc-content">
      <ul>
        <li data-i18n="privacy.li.no_audio_storage">No audio content is stored</li>
        <li data-i18n="privacy.li.temp_only">Only temporary data needed for analysis is processed</li>
        <li data-i18n="privacy.li.no_sale">User data is never sold</li>
      </ul>
    </div>
    <a class="back-link" href="/" data-i18n="privacy.back_link">Back to home</a>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LiveChord MIE</title>
  <script>(function(){try{var t=localStorage.getItem('livechord_theme');if(/^(light|forest|sakura|sunny|sky)$/.test(t))document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="icon" href="/favicon.svg?v=4" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css?v=24">
  <link rel="stylesheet" href="/css/mie.css?v=45">
</head>
<body class="mie-body">
  <!-- 頂列：MODE / SCENE / KEY / CHORD / BPM / clock / PANIC -->
  <!-- TWO EXPLICIT ROWS, not one row that wraps. Wrapping made the 風格 pill
       jump between the rows whenever anything in front of it changed width -
       a longer style name, the 我調過 N badge appearing - and a control that
       moves while you are reaching for it is worse than one in the wrong
       place. Row 1 is what the engine is hearing; row 2 is what you press. -->
  <header class="mie-top">
   <div class="mie-top-row">
    <div class="mie-brand">MIE <span class="mie-conn" id="mieConn" title="ws://127.0.0.1:8810/ws">●</span></div>
    <div class="mie-pill mie-mode" id="mieMode" title="運作模式（點擊切換）">
      <span class="mie-lbl">MODE</span>
      <select id="mieModeSel" class="mie-sel">
        <option>OFF</option><option>BYPASS</option><option>SAFE</option><option>AMBIENT</option>
        <option>INTERACTIVE</option><option>GENERATIVE</option><option>CHAOS</option>
      </select>
    </div>
    <div class="mie-pill" title="Scene">
      <span class="mie-lbl">SCENE</span>
      <select id="mieSceneSel" class="mie-sel"></select>
    </div>
    <div class="mie-pill"><span class="mie-lbl">KEY</span><span id="mieKey" class="mie-val">—</span></div>
    <div class="mie-pill mie-chord"><span class="mie-lbl">CHORD</span><span id="mieChord" class="mie-val">—</span></div>
    <div class="mie-pill"><span class="mie-lbl">彈法</span><span id="mieTexture" class="mie-val">—</span><span id="mieHands" class="mie-sub"></span></div>
    <div class="mie-pill"><span class="mie-lbl">BPM</span><span id="mieBpm" class="mie-val">—</span><span id="mieClock" class="mie-sub">scene</span></div>
    <div class="mie-pill"><span class="mie-lbl">BEAT</span><span id="mieBeat" class="mie-val">—</span></div>
    <div class="mie-pill mie-uc4" title="最後收到的 UC4 控制訊息（用來對 control_map.json 綁定）"><span class="mie-lbl">UC4</span><span id="mieUc4" class="mie-val">—</span></div>
    <div class="mie-spacer"></div>
    <button id="mieResume" class="mie-btn" title="離開 BYPASS，回到 scene 的模式">RESUME</button>
    <div class="mie-advice" id="mieAdvice" hidden>
      <button class="mie-adv-trigger" id="mieAdviceBtn" title="引擎注意到的落差。它只會說，不會自己動手；每一則都可以按「不用再提」永久關掉"><span class="mie-adv-dot"></span><span class="mie-adv-n">0</span><span class="mie-adv-lbl">落差</span></button>
      <div class="mie-adv-pop" id="mieAdvicePop" hidden></div>
    </div>
   </div>
   <div class="mie-top-row mie-top-actions">
    <div class="mie-pill mie-style" title="介入風格：一次把張力、厚度、時間與每個演算法的取音範圍換成一組。取消就全部回到你原本的設定">
      <span class="mie-lbl">風格</span>
      <select id="mieStyleSel" class="mie-sel"><option value="">—</option></select>
      <button id="mieRelease" class="mie-mine-btn" hidden>我調過 0</button>
    </div>
    <div class="mie-preset" title="A / LIVE / B：中間是你正在調的，左右是存好的。切過去再切回來，LIVE 原封不動">
      <button class="mie-pbtn" data-slot="A">A</button>
      <button class="mie-pbtn is-on" data-slot="LIVE">LIVE</button>
      <button class="mie-pbtn" data-slot="B">B</button>
      <button class="mie-pstore" data-store="A" title="把目前設定存到 A">＋A</button>
      <button class="mie-pstore" data-store="B" title="把目前設定存到 B">＋B</button>
    </div>
    <button id="mieFreeze" class="mie-btn" title="按住引擎現在正在響的聲音，讓你在上面繼續彈（空白鍵）">凍結</button>
    <button id="mieUndo" class="mie-btn" title="復原上一個參數調整（Ctrl+Z）">↶</button>
    <button id="mieRevert" class="mie-btn" title="全部退回 scene 檔存著的值">退回檔案</button>
    <button id="mieSave" class="mie-btn" title="把目前所有調整寫回 scene 檔">儲存</button>
    <button id="mieRollBtn" class="mie-btn" title="鋼琴捲軸：把一整趟的音畫出來，或載入舊的 log 回顧（R）">捲軸</button>
    <button id="miePanic" class="mie-btn mie-btn-panic" title="兩個 Out port 各自 CH1–16 送 CC120/123/64=0，再補 note_off；引擎進 BYPASS（快捷鍵 Esc Esc）">PANIC</button>
   </div>
  </header>

  <div id="mieHalt" class="mie-halt" hidden><b>引擎已停止</b><span id="mieHaltWhy"></span><button id="mieHaltResume" class="mie-btn">RESUME</button></div>
  <main class="mie-main">
    <!-- 左：能量儀表 -->
    <section class="mie-col mie-meters">
      <div class="lc-title">能量</div>
      <div class="mie-meter"><span class="mie-mlbl">DENSITY</span><div class="mie-bar"><div id="mDensity" class="mie-fill"></div></div><span id="vDensity" class="mie-mval">0</span></div>
      <div class="mie-meter"><span class="mie-mlbl">ENERGY</span><div class="mie-bar"><div id="mEnergy" class="mie-fill mie-fill-energy"></div></div><span id="vEnergy" class="mie-mval">0</span></div>
      <div class="mie-meter"><span class="mie-mlbl">RESTRAINT</span><div class="mie-bar"><div id="mRestraint" class="mie-fill mie-fill-restraint"></div></div><span id="vRestraint" class="mie-mval">1.00</span></div>
      <div class="mie-meter"><span class="mie-mlbl">SILENCE</span><div class="mie-bar"><div id="mSilence" class="mie-fill mie-fill-silence"></div></div><span id="vSilence" class="mie-mval">0.0 s</span></div>
      <div class="mie-meter"><span class="mie-mlbl">VEL</span><div class="mie-bar"><div id="mVel" class="mie-fill"></div></div><span id="vVel" class="mie-mval">0</span></div>

      <div class="lc-title mie-title-gap">全域</div>
      <label class="mie-slider"><span class="mie-mlbl">音量</span><input id="gMaster" type="range" min="0" max="1" step="0.01"><span id="gMasterV" class="mie-mval">1.00</span></label>
      <label class="mie-slider"><span class="mie-mlbl">張力</span><input id="gTension" type="range" min="0" max="1" step="0.05"><span id="gTensionV" class="mie-mval">0.00</span></label>
      <label class="mie-slider"><span class="mie-mlbl">厚度</span><input id="gDensity" type="range" min="0" max="1" step="0.05"><span id="gDensityV" class="mie-mval">0.50</span></label>
      <label class="mie-slider" title="一顆旋鈕拉長或壓縮全場的等待時間：回音的延遲、pad 的持續、聲部進場前要多安靜。走音樂性的階梯 ¼ ⅓ ½ ⅔ 1 1½ 2 3 4"><span class="mie-mlbl">時間</span><input id="gTime" type="range" min="0.25" max="4" step="0.05"><span id="gTimeV" class="mie-mval">1.00</span></label>
      <label class="mie-slider"><span class="mie-mlbl">PROB</span><input id="gProb" type="range" min="0" max="1" step="0.01"><span id="gProbV" class="mie-mval">0.60</span></label>
      <label class="mie-slider"><span class="mie-mlbl">CHAOS</span><input id="gChaos" type="range" min="0" max="1" step="0.01"><span id="gChaosV" class="mie-mval">0.00</span></label>
      <label class="mie-slider"><span class="mie-mlbl">RESTR.</span><input id="gRestraint" type="range" min="0" max="1" step="0.01"><span id="gRestraintV" class="mie-mval">1.00</span></label>

      <div class="lc-title mie-title-gap">樂器</div>
      <div id="mieInstruments" class="mie-inst-list"></div>
    </section>

    <!-- 中：互動邊（Phase 1：清單；矩陣 / 動畫留 Phase 2） -->
    <section class="mie-col mie-edges">
      <div class="lc-title mie-edges-title">互動邊 <span class="lc-subtitle">最近 2 s 觸發的邊會亮起；勾選 = 啟用；數字 = 觸發次數</span>
        <span class="mie-spacer"></span>
        <button id="mieAllOn" class="mie-btn mie-btn-sm" title="每一條邊都打開">全開</button>
        <button id="mieAllOff" class="mie-btn mie-btn-sm" title="每一條邊都讓開，並收掉它們已經排好和正在響的音。要單獨聽一條線：按這個，再把那一條勾回來">全部略過</button>
      </div>
      <div id="mieEdges" class="mie-edge-list"></div>
      <div class="lc-title mie-title-gap">統計</div>
      <div id="mieStats" class="mie-stats"></div>
    </section>
  </main>

  <!-- 引擎說的話。每個音的流水帳在捲軸上看得更清楚，這裡只留你不能錯過的那幾種：
       丟棄、PANIC、迴路、風格、存檔、以及存不下去的原因。 -->
  <div id="mieNotice" class="mie-notice" hidden></div>

  <!-- 鋼琴捲軸：預設打開、預設即時。它就是這個面板的事件流——一整趟的音畫在
       同一張圖上，比一行一行捲過去好讀。收起來的話下次還是收著。 -->
  <section id="mieRoll" class="mie-roll" hidden>
    <div class="mr-bar">
      <button class="mr-play mie-btn" title="播放／暫停（空白鍵在捲軸上時）">▶</button>
      <span class="mr-time">0:00 / 0:00</span>
      <input class="mr-seek" type="range" min="0" max="10" step="0.01" value="0" title="拖曳移動播放頭">
      <select class="mr-speed mie-sel" title="回放速度：慢下來才看得出撞音與延遲">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
      </select>
      <button class="mr-loop mie-btn" title="Shift + 拖曳畫出反覆區間；按這裡清掉">循環</button>
      <button class="mr-sound mie-btn" title="播放時把這一段真的送回樂器。預設關著——按下去會發出聲音。圖例上「你」還亮著的話，你彈的那部分也會送回你的琴">🔇 靜音回放</button>
      <label class="mr-zoomwrap" title="縮放：一個畫面幾秒（滑鼠滾輪也可以）">
        <span class="mie-lbl">縮放</span>
        <input class="mr-zoom" type="range" min="1" max="600" step="1" value="20">
      </label>
      <span class="mie-spacer"></span>
      <button class="mr-live mie-btn" title="即時：畫引擎正在送出的音。預設關著">○ 即時</button>
      <button id="mieLogSave" class="mie-btn" title="把剛剛這一段收成一個獨立的錄音檔，然後立刻開始錄下一段。不用停引擎、不用回 console 按 q（Ctrl+S）">存這段</button>
      <select class="mr-logs mie-sel" title="這台引擎自己錄下的 session，新的在最上面">
        <option value="">載入錄音…</option>
      </select>
      <label class="mie-btn mr-filebtn" title="載入別處來的 session JSONL">檔案
        <input class="mr-file" type="file" accept=".jsonl,.json,.txt" hidden>
      </label>
      <button id="mieRollClose" class="mie-btn" title="收起捲軸">✕</button>
    </div>
    <div class="mr-lanes"></div>
    <div class="mr-stage"><canvas class="mr-canvas"></canvas></div>
    <div class="mr-foot"><span class="mr-title">尚未載入</span><span class="mr-note"></span></div>
  </section>

  <script src="/js/mie-roll.js?v=12"></script>
  <script src="/js/mie.js?v=71"></script>
</body>
</html>
